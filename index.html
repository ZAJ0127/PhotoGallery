<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sorter">
<title>Photo Sorter</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#111114;--bg2:#16161a;--sur:#1c1c21;--sur2:#24242b;--sur3:#2a2a33;--sur4:#34343e;
  --line:#24242b;--txt:#f2f2f4;--txt2:#c5c5cf;--mut:#9a9aa6;--acc:#ff7a59;--acc2:#ff8a66;--star:#ffd166;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font-family:Manrope,system-ui,-apple-system,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
input,select{background:var(--sur2);border:0;border-radius:12px;padding:12px 14px;width:100%;color:var(--txt);font-weight:600;outline:none}
input:focus,select:focus{box-shadow:0 0 0 2px var(--acc)}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#app{flex:1;display:flex;flex-direction:column;min-height:0}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:24px}
.head{padding:calc(var(--sat) + 14px) 20px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0}
.title{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0}
.title.sm{font-size:20px}
.icon-btn{width:44px;height:44px;border-radius:22px;background:var(--sur);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn.acc{background:var(--acc);color:#111114}
.pill{height:36px;padding:0 14px;border-radius:18px;background:var(--sur);font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;color:var(--txt2);flex-shrink:0;white-space:nowrap}
.pill.on{background:var(--txt);color:#111114}
.pill.acc{background:var(--acc);color:#111114}
.chips{display:flex;gap:8px;padding:0 20px 14px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.chips::-webkit-scrollbar{display:none}
.section{padding:0 20px}
.label{font-size:13px;font-weight:800;color:var(--mut);padding:0 20px 8px}
.row-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 20px 8px}
.link{color:var(--acc2);font-size:13px;font-weight:700}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;padding:0 20px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 20px}
.tile{display:flex;flex-direction:column;gap:3px;background:none;text-align:left;color:inherit;min-width:0}
.tile .img{position:relative;aspect-ratio:1;background:var(--sur2);border-radius:4px;overflow:hidden}
.tile .img img{width:100%;height:100%;object-fit:cover;display:block}
.tile.sel .img{outline:3px solid var(--acc);outline-offset:-3px}
.tile .ind{display:flex;gap:3px;align-items:center;height:12px}
.dot{width:8px;height:8px;border-radius:4px;flex-shrink:0}
.chk{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:11px;border:2px solid #fff;opacity:.85}
.tile.sel .chk{background:var(--acc);border-color:var(--acc);display:flex;align-items:center;justify-content:center;opacity:1}
.card{display:flex;flex-direction:column;gap:8px;text-align:left;color:inherit;min-width:0}
.card .cov{aspect-ratio:1;border-radius:16px;background:var(--sur2);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;color:#111114}
.card .cov img{width:100%;height:100%;object-fit:cover;display:block}
.card .nm{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .mt{font-size:12px;font-weight:600;color:var(--mut)}
.month{font-size:13px;font-weight:800;color:var(--mut);padding:10px 20px 8px}
.tabbar{display:flex;justify-content:space-around;align-items:flex-start;border-top:1px solid var(--line);padding:10px 4px calc(var(--sab) + 12px);background:var(--bg2);flex-shrink:0}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;width:64px;color:var(--mut);font-size:11px;font-weight:700;text-decoration:none}
.tab.on{color:var(--acc);font-weight:800}
.tab .fab{width:44px;height:44px;border-radius:22px;background:var(--acc);display:flex;align-items:center;justify-content:center;margin-top:-18px;color:#111114}
.bar{display:flex;gap:10px;padding:12px 20px calc(var(--sab) + 14px);flex-shrink:0;background:var(--bg)}
.btn{height:52px;border-radius:16px;background:var(--sur);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;flex:1}
.btn.pri{background:var(--acc);color:#111114;font-weight:800;flex:2}
.btn.sm{height:40px;font-size:13px;border-radius:12px;padding:0 12px;flex:0 0 auto}
.btn.danger{color:var(--acc2)}
.btn:disabled{opacity:.4}
.stage{margin:0 20px;border-radius:20px;background:var(--sur2);overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stage img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:10px 20px 0;min-height:38px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 8px 5px 8px;border-radius:14px;background:var(--sur3);font-size:12px;font-weight:700}
.tag .x{width:16px;height:16px;border-radius:8px;background:var(--sur4);display:flex;align-items:center;justify-content:center;color:var(--txt2)}
.hrow{display:flex;gap:12px;padding:0 20px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.hrow::-webkit-scrollbar{display:none}
.av{display:flex;flex-direction:column;align-items:center;gap:6px;width:70px;flex-shrink:0;color:var(--txt2);font-size:12px;font-weight:600}
.av .c{width:64px;height:64px;border-radius:32px;background:var(--sur3);border:3px solid transparent;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#111114;overflow:hidden}
.av .c img{width:100%;height:100%;object-fit:cover}
.av.on{color:var(--txt);font-weight:700}
.av.on .c{border-color:var(--txt);box-shadow:0 0 0 3px var(--acc)}
.sq{display:flex;flex-direction:column;gap:6px;width:96px;flex-shrink:0;color:var(--txt2);font-size:12px;font-weight:600;text-align:left}
.sq .c{width:96px;height:96px;border-radius:14px;background:var(--sur3);border:2px solid transparent;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:11px}
.sq .c img{width:100%;height:100%;object-fit:cover}
.sq.on{color:var(--txt);font-weight:700}
.sq.on .c{border-color:var(--acc)}
.list{margin:0 20px;border-radius:16px;overflow:hidden;background:var(--sur)}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--bg);width:100%;text-align:left;color:inherit}
.li:last-child{border-bottom:0}
.li .t{font-size:15px;font-weight:700}
.li .s{font-size:12px;font-weight:600;color:var(--mut);margin-top:2px}
.sw{width:46px;height:28px;border-radius:14px;background:var(--sur4);position:relative;flex-shrink:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:12px;background:var(--mut);transition:transform .15s}
.sw.on{background:var(--acc)}.sw.on::after{background:#111114;transform:translateX(18px)}
.seg{display:flex;background:var(--sur);border-radius:12px;padding:3px;margin:0 20px 16px}
.seg button{flex:1;height:38px;border-radius:10px;font-size:13px;font-weight:700;color:var(--mut)}
.seg button.on{background:var(--sur4);color:var(--txt)}
.empty{padding:40px 30px;text-align:center;color:var(--mut);font-size:14px;font-weight:600;line-height:1.5}
.note{font-size:12px;font-weight:600;color:var(--mut);padding:10px 20px 0;line-height:1.4}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--bg2);border-radius:22px 22px 0 0;width:100%;max-height:88%;display:flex;flex-direction:column;padding-bottom:var(--sab)}
.sheet .h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 8px}
.sheet .h h2{margin:0;font-size:18px;font-weight:800}
.sheet .b{overflow-y:auto;padding:8px 0 12px}
.viewer{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column}
.viewer .vh{display:flex;justify-content:space-between;padding:calc(var(--sat) + 10px) 14px 8px}
.viewer .vi{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.viewer .vi img{max-width:100%;max-height:100%;object-fit:contain}
.viewer .vf{padding:8px 0 calc(var(--sab) + 10px);background:rgba(17,17,20,.9)}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 90px);transform:translateX(-50%);background:var(--txt);color:#111114;padding:10px 16px;border-radius:14px;font-size:13px;font-weight:700;z-index:40;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
.form{display:flex;flex-direction:column;gap:12px;padding:8px 20px 16px}
.form label{font-size:12px;font-weight:700;color:var(--mut);display:flex;flex-direction:column;gap:6px}
.spin{width:22px;height:22px;border:3px solid var(--sur4);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.editor{position:fixed;inset:0;background:#000;z-index:35;display:flex;flex-direction:column}
.editor canvas{touch-action:none;display:block}
.editor .eh{display:flex;justify-content:space-between;align-items:center;padding:calc(var(--sat) + 10px) 14px 8px;color:var(--txt)}
.progress{position:fixed;top:0;left:0;right:0;padding:calc(var(--sat) + 10px) 20px 10px;background:var(--bg2);z-index:50;display:flex;align-items:center;gap:12px;font-size:13px;font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<div class="toast" id="toast"></div>
<input type="file" id="picker" accept="image/*" multiple hidden>
<input type="file" id="zipPicker" accept=".zip,application/zip" hidden>
<script>
/* ---------- tiny helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const PALETTE=['#ff7a59','#5aa9ff','#c99bff','#ffd166','#7fd18c','#ff9ec4','#6ee7d8','#f4a261'];
const colorFor=id=>{let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))>>>0;return PALETTE[h%PALETTE.length]};
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1800)}
const I={
 plus:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
 x:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
 chev:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
 check:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>',
 gal:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
 person:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>',
 star:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.4 6.3 20.5l1.2-6.4L2.8 9.7l6.4-.8z"/></svg>',
 starF:'<svg width="22" height="22" viewBox="0 0 24 24" fill="#ffd166" stroke="#ffd166" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.4 6.3 20.5l1.2-6.4L2.8 9.7l6.4-.8z"/></svg>',
 starS:'<svg width="12" height="12" viewBox="0 0 24 24" fill="#ffd166" stroke="none"><path d="M12 3l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.4 6.3 20.5l1.2-6.4L2.8 9.7l6.4-.8z"/></svg>',
 sort:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h10M4 17h6"/><path d="M17 15l3 3-3 3"/></svg>',
 more:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>',
 shuffle:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h4l10 10h4M3 17h4l10-10h4"/><path d="M18 4l3 3-3 3M18 14l3 3-3 3"/></svg>',
 trash:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
 edit:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10-4-4L4 16v4z"/><path d="M12 8l4 4"/></svg>',
 tagI:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V4h8l9 9-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/></svg>',
 img:'<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg>',
 up:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>',
 down:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
};

/* ---------- IndexedDB ---------- */
const DB=(()=>{
  let db;
  const open=()=>new Promise((res,rej)=>{
    const r=indexedDB.open('photosorter',2);
    r.onupgradeneeded=e=>{const d=e.target.result;const has=n=>d.objectStoreNames.contains(n);
      if(!has('photos'))d.createObjectStore('photos',{keyPath:'id'});
      if(!has('items'))d.createObjectStore('items',{keyPath:'id'});
      if(!has('cats'))d.createObjectStore('cats',{keyPath:'id'});
      if(!has('meta'))d.createObjectStore('meta',{keyPath:'k'});
      if(!has('blobs'))d.createObjectStore('blobs',{keyPath:'id'});};
    r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error);
  });
  const tx=(s,m,fn)=>new Promise((res,rej)=>{const t=db.transaction(s,m);const st=t.objectStore(s);const q=fn(st);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)});
  return{open,
    all:s=>tx(s,'readonly',st=>st.getAll()),
    get:(s,k)=>tx(s,'readonly',st=>st.get(k)),
    put:(s,v)=>tx(s,'readwrite',st=>st.put(v)),
    putMany:(s,vs)=>tx(s,'readwrite',st=>{vs.forEach(v=>st.put(v))}),
    del:(s,k)=>tx(s,'readwrite',st=>st.delete(k)),
    clear:s=>tx(s,'readwrite',st=>st.clear())};
})();

/* ---------- state ---------- */
const S={photos:[],items:[],cats:[],view:'gallery',galFilter:'all',select:null,catSort:{},itemId:null,subId:null,
  sortFilter:'unsorted',sortQueue:[],sortIdx:0,sortCat:null,sortItem:null,draft:[],favFilter:'all',shufFilter:'all',shufId:null,
  catView:null,history:[]};
const urls={};
function thumbUrl(p){if(!p)return'';if(!urls['t'+p.id])urls['t'+p.id]=URL.createObjectURL(p.thumb);return urls['t'+p.id]}
function fullUrl(p){if(!urls['f'+p.id])urls['f'+p.id]=URL.createObjectURL(p.full);return urls['f'+p.id]}
const photoById=id=>S.photos.find(p=>p.id===id);
const itemById=id=>S.items.find(i=>i.id===id);
const catById=id=>S.cats.find(c=>c.id===id);
const enabledCats=()=>S.cats.filter(c=>c.enabled).sort((a,b)=>a.order-b.order);
const quickCats=()=>enabledCats().filter(c=>c.quick);
const mainCats=()=>enabledCats().filter(c=>!c.quick);
const primaryCat=()=>mainCats()[0]||enabledCats()[0];
const itemsOf=cat=>S.items.filter(i=>i.cat===cat);
const subOf=(item,subId)=>item&&item.subs.find(s=>s.id===subId);
function tagLabel(t){const it=itemById(t.item);if(!it)return null;const sb=subOf(it,t.sub);return it.name+(sb?' · '+sb.name:'')}
function photoItems(p){return [...new Set(p.tags.map(t=>t.item))].map(itemById).filter(Boolean)}
const byNewest=(a,b)=>b.added-a.added;

async function seed(){
  if(S.cats.length)return;
  const c2={id:uid(),name:'Shows',subLabel:'Seasons',groupLabel:'',enabled:true,order:1};
  const c1={id:uid(),name:'Characters',subLabel:'Outfits',groupLabel:'Show',groupCat:c2.id,enabled:true,order:0};
  await DB.putMany('cats',[c1,c2]);S.cats=[c1,c2];
}
async function seedQuick(){
  if(S.cats.some(c=>c.quick))return;
  const c={id:uid(),name:'Type',subLabel:'Variants',groupLabel:'',enabled:true,order:S.cats.length,quick:true};
  await saveCat(c);S.cats.push(c);
  const its=['Official art','Anime','Fanart','3D','NSFW'].map((n,i)=>({id:uid(),cat:c.id,name:n,group:'',cover:null,subs:[],order:i,added:Date.now()}));
  await DB.putMany('items',its);S.items.push(...its);
}
async function load(){
  await DB.open();
  S.cats=await DB.all('cats');S.items=await DB.all('items');S.photos=await DB.all('photos');
  const blobs=new Map((await DB.all('blobs')).map(b=>[b.id,b]));
  for(const p of S.photos){
    let b=blobs.get(p.id);
    if(!b&&p.full){ // legacy record with inline blobs: move them to the blobs store, rebuilt from bytes
      let orig=null;try{orig=p.orig?{w:p.orig.w,h:p.orig.h,hash:p.orig.hash,buf:p.orig.buf||await p.orig.full.arrayBuffer()}:null}catch(e){}
      let full=p.full,thumb=p.thumb;try{full=await fresh(p.full);thumb=await fresh(p.thumb)}catch(e){}
      b={id:p.id,full,thumb,orig};try{await DB.put('blobs',b)}catch(e){}
      await DB.put('photos',meta(Object.assign(p,{hasOrig:!!b.orig})));
    }
    if(b){p.full=b.full;p.thumb=b.thumb;p.orig=b.orig||undefined;p.hasOrig=!!b.orig}
  }
  S.photos=S.photos.filter(p=>p.full);
  await seed();await seedQuick();await migrateGroups();
  S.photos.sort(byNewest);
}

const groupCatOf=cat=>cat&&cat.groupCat?catById(cat.groupCat):null;
const groupLabelOf=cat=>{const g=groupCatOf(cat);return g?g.name.replace(/s$/,''):(cat.groupLabel||'')};
const groupName=it=>{const g=it.groupId&&itemById(it.groupId);return g?g.name:(it.group||'')};
async function migrateGroups(){
  // Link text-based groups to real items in the group category.
  for(const c of S.cats){
    if(c.groupLabel&&!c.groupCat){const g=S.cats.find(x=>x.id!==c.id&&!x.quick&&x.name.toLowerCase().startsWith(c.groupLabel.toLowerCase()));if(g){c.groupCat=g.id;await saveCat(c)}}
    const g=groupCatOf(c);if(!g)continue;
    for(const it of itemsOf(c.id)){
      if(it.groupId||!it.group)continue;
      let gi=itemsOf(g.id).find(x=>x.name.trim().toLowerCase()===it.group.trim().toLowerCase());
      if(!gi){gi={id:uid(),cat:g.id,name:it.group.trim(),cover:null,subs:[],order:itemsOf(g.id).length,added:Date.now()};await saveItem(gi);S.items.push(gi)}
      it.groupId=gi.id;delete it.group;await saveItem(it);
    }
  }
}
/* ---------- image processing ---------- */
const fresh=async blob=>new Blob([await blob.arrayBuffer()],{type:blob.type||'image/jpeg'});
function loadImage(blob,retry=true){return new Promise((res,rej)=>{const u=URL.createObjectURL(blob);const im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im)};im.onerror=async()=>{URL.revokeObjectURL(u);if(!retry){rej(new Error('Not an image'));return}try{res(await loadImage(await fresh(blob),false))}catch(e){rej(e)}};im.src=u})}
function draw(im,max){const s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c}
const toBlob=(c,q)=>new Promise(r=>c.toBlob(r,'image/jpeg',q));
function dhash(im){const c=document.createElement('canvas');c.width=9;c.height=8;const x=c.getContext('2d');x.drawImage(im,0,0,9,8);const d=x.getImageData(0,0,9,8).data;let bits='';for(let y=0;y<8;y++){for(let i=0;i<8;i++){const a=(y*9+i)*4,b=a+4;const la=d[a]*.299+d[a+1]*.587+d[a+2]*.114,lb=d[b]*.299+d[b+1]*.587+d[b+2]*.114;bits+=la>lb?'1':'0'}}return bits}
function hamming(a,b){let n=0;for(let i=0;i<64;i++)if(a[i]!==b[i])n++;return n}
async function importFiles(files){
  const list=[...files].filter(f=>f.type.startsWith('image/')||/\.(jpe?g|png|webp|gif|heic)$/i.test(f.name));
  if(!list.length){toast('No images selected');return}
  showProgress(0,list.length);
  let n=0,fail=0;const added=[];
  for(const f of list){
    try{
      const im=await loadImage(f);
      const full=await toBlob(draw(im,2000),.86);
      const thumb=await toBlob(draw(im,320),.8);
      const p={id:uid(),name:f.name,added:f.lastModified||Date.now(),imported:Date.now(),w:im.naturalWidth,h:im.naturalHeight,full,thumb,hash:dhash(im),fav:false,tags:[]};
      await saveBlobs(p);await savePhoto(p);S.photos.push(p);added.push(p);
    }catch(e){fail++}
    showProgress(++n,list.length);
  }
  S.photos.sort(byNewest);hideProgress();
  toast(`Added ${added.length} photo${added.length===1?'':'s'}`+(fail?`, ${fail} skipped`:''));
  render();
}
function showProgress(n,t){let e=$('#prog');if(!e){e=document.createElement('div');e.id='prog';e.className='progress';document.body.appendChild(e)}e.innerHTML=`<div class="spin"></div><div>Importing ${n} of ${t}</div>`}
function hideProgress(){const e=$('#prog');if(e)e.remove()}

/* ---------- persistence ---------- */
function applyImplied(tags){
  // A character tagged with a show (its group) also gets that show's tag.
  for(const t of tags.slice()){const it=itemById(t.item);if(!it||!it.groupId)continue;
    if(itemById(it.groupId)&&!tags.some(k=>k.item===it.groupId))tags.push({item:it.groupId,sub:null})}
  return tags;
}
function meta(p){const {full,thumb,orig,...m}=p;m.hasOrig=!!orig;return m}
const savePhoto=p=>{applyImplied(p.tags);return DB.put('photos',meta(p))};
const saveBlobs=p=>DB.put('blobs',{id:p.id,full:p.full,thumb:p.thumb,orig:p.orig||null});
const saveItem=i=>DB.put('items',i);
const saveCat=c=>DB.put('cats',c);
async function deletePhotos(ids){
  for(const id of ids){await DB.del('photos',id);await DB.del('blobs',id);['t','f'].forEach(k=>{if(urls[k+id]){URL.revokeObjectURL(urls[k+id]);delete urls[k+id]}})}
  S.photos=S.photos.filter(p=>!ids.includes(p.id));
  for(const it of S.items){let ch=false;if(ids.includes(it.cover)){it.cover=null;ch=true}for(const s of it.subs)if(ids.includes(s.cover)){s.cover=null;ch=true}if(ch)await saveItem(it)}
}

<script>
/* ---------- navigation ---------- */

/* ---------- shared bits ---------- */

function tileHTML(p,sel){return `<button class="tile ${sel?'sel':''}" data-act="tile" data-id="${p.id}"><div class="img"><img src="${thumbUrl(p)}" alt="" loading="lazy" data-p="${p.id}" data-k="t">${S.select?`<div class="chk">${sel?I.check:''}</div>`:''}</div><div class="ind">${dotsFor(p)}</div></button>`}

/* ---------- Category view (Characters / Shows / …) ---------- */

  if(mode==='recent')return its.sort(byNewest);

    body=[...g].map(([k,l])=>`<div class="month" style="padding-top:4px">${esc(k)}</div><div class="grid2" style="margin-bottom:16px">${l.map(i=>itemCard(i,cat)).join('')}</div>`).join('');
  } else body=`<div class="grid2">${its.map(i=>itemCard(i,cat,mode==='custom')).join('')}</div>`;
  const catChips=`<div class="chips">${enabledCats().map(c=>`<button class="pill ${c.id===cat.id?'on':''}" data-nav="cat:${c.id}">${esc(c.name)}</button>`).join('')}</div>`;
  return `<div class="screen"><div class="head"><h1 class="title">${esc(cat.name)}</h1><button class="icon-btn acc" data-act="newItem" aria-label="New">${I.plus}</button></div>${catChips}${seg}<div class="scroll">${body}</div>${nav()}</div>`;
}
function itemCard(i,cat,reorder){
  const n=S.photos.filter(p=>p.tags.some(t=>t.item===i.id)).length;
  return `<div style="display:flex;flex-direction:column;gap:6px;min-width:0"><button class="card" data-act="openItem" data-id="${i.id}"><div class="cov" style="background:${colorFor(i.id)}">${coverHTML(i.cover,i.name[0]||'?',i.coverCrop)}</div><div class="nm">${esc(i.name)}</div><div class="mt">${groupName(i)?esc(groupName(i))+' · ':''}${n} photo${n===1?'':'s'}${i.subs.length?' · '+i.subs.length+' '+esc(cat.subLabel.toLowerCase()):''}</div></button>${reorder?`<div style="display:flex;gap:6px"><button class="pill" style="height:30px;padding:0 10px" data-act="itemUp" data-id="${i.id}" aria-label="Move up">${I.up}</button><button class="pill" style="height:30px;padding:0 10px" data-act="itemDown" data-id="${i.id}" aria-label="Move down">${I.down}</button></div>`:''}</div>`;
}

/* ---------- Item detail ---------- */
function itemView(){
  const it=itemById(S.itemId);if(!it)return gallery();const cat=catById(it.cat);
  const all=S.photos.filter(p=>p.tags.some(t=>t.item===it.id));

}

function quickRows(draft,act){
  return quickCats().map(c=>{const its=sortedItems(c);if(!its.length)return'';return `<div class="row-head" style="padding-top:14px"><div class="label" style="padding:0">${esc(c.name)}</div><button class="link" data-act="${act}New" data-cat="${c.id}">+ New</button></div><div class="chips" style="padding-bottom:0">${its.map(i=>{const on=draft.some(t=>t.item===i.id);return `<button class="pill ${on?'acc':''}" data-act="${act}" data-id="${i.id}">${esc(i.name)}${on?' ✓':''}</button>`}).join('')}</div>`}).join('');
}
/* ---------- Sort mode ---------- */
function sortFilters(){
  const f=[{k:'unsorted',l:'Unsorted',fn:p=>!p.tags.length}];
  for(const c of enabledCats()){const ids=new Set(itemsOf(c.id).map(i=>i.id));if(ids.size)f.push({k:'nocat:'+c.id,l:'No '+c.name.toLowerCase(),fn:p=>!p.tags.some(t=>ids.has(t.item))})}

  for(const c of enabledCats()){const g=groupCatOf(c);if(!g)continue;const ids=new Set(itemsOf(c.id).map(i=>i.id));for(const gi of itemsOf(g.id))if(S.photos.some(p=>p.tags.some(t=>t.item===gi.id)))f.push({k:'nogroup:'+gi.id+':'+c.id,l:gi.name+' · no '+c.name.toLowerCase(),fn:p=>p.tags.some(t=>t.item===gi.id)&&!p.tags.some(t=>ids.has(t.item))})}

  return f;
}
function startSort(filter){

  S.sortQueue=S.photos.filter(f.fn).map(p=>p.id);S.sortIdx=0;
  loadDraft();go('sort');
}
function loadDraft(){const p=photoById(S.sortQueue[S.sortIdx]);S.draft=p?p.tags.map(t=>({...t})):[];S.sortCat=(S.sortCat&&mainCats().some(c=>c.id===S.sortCat))?S.sortCat:(primaryCat()&&primaryCat().id);const it=S.sortItem&&itemById(S.sortItem);if(!it||it.cat!==S.sortCat)S.sortItem=null}
function sortView(){
  const p=photoById(S.sortQueue[S.sortIdx]);const fs=sortFilters();
  const chips=`<div class="chips">${fs.map(f=>`<button class="pill ${S.sortFilter===f.k?'on':''}" data-act="sortFilter" data-k="${f.k}">${esc(f.l)}</button>`).join('')}</div>`;
  const head=`<div class="head"><div style="display:flex;align-items:center;gap:10px"><button class="icon-btn" data-act="closeSort" aria-label="Close">${I.x}</button><div style="font-size:18px;font-weight:800">Sort</div></div><div style="font-size:14px;font-weight:600;color:var(--mut)">${p?`${S.sortIdx+1} of ${S.sortQueue.length}`:''}</div></div>`;
  if(!p)return `<div class="screen">${head}${chips}<div class="empty" style="flex:1">${S.sortQueue.length?'All done — every photo in this filter is sorted.':'Nothing matches this filter.'}<br>Pick another filter, or add more photos.</div>${nav()}</div>`;

/* ---------- Duplicates ---------- */
function findDupes(){
  const ps=S.photos.slice();const pairs=[];const used=new Set();
  for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){const d=hamming(ps[i].hash,ps[j].hash);if(d<=6&&!used.has(ps[j].id)){pairs.push({a:ps[i],b:ps[j],d});used.add(ps[j].id)}}
  return pairs.map(({a,b,d})=>{const keep=a.full.size>=b.full.size?a:b;const rm=keep===a?b:a;return {keep,rm,d}});
}
function dupesView(){
  const pairs=S.dupePairs||(S.dupePairs=findDupes().filter(x=>!(S.notDupes||new Set()).has(x.keep.id+'|'+x.rm.id)));
  return `<div class="screen"><div class="head" style="justify-content:flex-start;gap:12px"><button class="icon-btn" data-act="back" aria-label="Back">${I.back}</button><h1 class="title sm">Duplicates</h1></div>
  <div class="scroll"><div class="note" style="padding-top:0;padding-bottom:14px">Compared by image hash. ${pairs.length} pair${pairs.length===1?'':'s'} found in ${S.photos.length} photos. Tags and favorites on the removed copy move to the kept one.</div>
  ${pairs.length?pairs.map((x,i)=>`<div style="margin:0 20px 12px;padding:14px;border-radius:16px;background:var(--sur);display:flex;flex-direction:column;gap:10px"><div style="display:flex;gap:10px"><div style="flex:1"><div style="aspect-ratio:1;border-radius:10px;overflow:hidden;outline:3px solid var(--acc);outline-offset:-3px"><img src="${thumbUrl(x.keep)}" style="width:100%;height:100%;object-fit:cover" alt="" data-p="${x.keep.id}" data-k="t"></div><div style="font-size:11px;font-weight:700;padding-top:6px">Keep · ${(x.keep.full.size/1048576).toFixed(1)} MB</div></div><div style="flex:1"><div style="aspect-ratio:1;border-radius:10px;overflow:hidden"><img src="${thumbUrl(x.rm)}" style="width:100%;height:100%;object-fit:cover" alt="" data-p="${x.rm.id}" data-k="t"></div><div style="font-size:11px;font-weight:600;color:var(--mut);padding-top:6px">Remove · ${(x.rm.full.size/1048576).toFixed(1)} MB</div></div></div><div style="display:flex;align-items:center;justify-content:space-between"><div style="font-size:12px;font-weight:600;color:var(--mut)">${x.d===0?'Exact match':'Near match'}</div><div style="display:flex;gap:6px"><button class="pill" data-act="dupeSwap" data-i="${i}">Swap</button><button class="pill" data-act="dupeNot" data-i="${i}">Not a dupe</button><button class="pill acc" data-act="dupeRemove" data-i="${i}">Remove</button></div></div></div>`).join(''):'<div class="empty">No duplicates found.</div>'}</div>
  <div class="bar"><button class="btn pri" data-act="dupeAll" ${pairs.length?'':'disabled'}>Remove all ${pairs.length}</button></div></div>`;
}
async function mergeRemove(keep,rm){
  for(const t of rm.tags)addTag(keep.tags,t.item,t.sub);
  keep.fav=keep.fav||rm.fav;await savePhoto(keep);
  for(const it of S.items){let ch=false;if(it.cover===rm.id){it.cover=keep.id;ch=true}for(const s of it.subs)if(s.cover===rm.id){s.cover=keep.id;ch=true}if(ch)await saveItem(it)}
  await deletePhotos([rm.id]);
}

/* ---------- sheets ---------- */
function sheet(title,bodyHTML,onBind){
  const L=$('#layer');L.innerHTML=`<div class="sheet-bg" data-close><div class="sheet"><div class="h"><h2>${title}</h2><button class="icon-btn" data-close aria-label="Close">${I.x}</button></div><div class="b">${bodyHTML}</div></div></div>`;
  L.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',e=>{if(b.classList.contains('sheet-bg')?e.target===b:true)closeSheet()}));
  onBind&&onBind(L.firstElementChild);
}
function closeSheet(){$('#layer').innerHTML=''}
function formSheet(title,fields,onSave,onDelete){
  const b=`<div class="form">${fields.map(f=>f.type==='select'?`<label>${esc(f.label)}<select name="${f.name}">${f.options.map(o=>`<option value="${esc(o.v)}" ${o.v===f.value?'selected':''}>${esc(o.l)}</option>`).join('')}</select></label>`:`<label>${esc(f.label)}<input name="${f.name}" value="${esc(f.value||'')}" placeholder="${esc(f.ph||'')}" ${f.list?`list="${f.list}"`:''} autocomplete="off"></label>${f.list?`<datalist id="${f.list}">${f.listOpts.map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`:''}`).join('')}
  <button class="btn pri" data-save>Save</button>${onDelete?`<button class="btn danger" data-del>Delete</button>`:''}</div>`;
  sheet(title,b,el=>{
    const first=el.querySelector('input');first&&setTimeout(()=>first.focus(),50);
    const cond=()=>fields.forEach(f=>{if(!f.showIf)return;const [n,val]=f.showIf.split('=');const on=el.querySelector(`[name="${n}"]`).value===val;el.querySelector(`[name="${f.name}"]`).closest('label').style.display=on?'':'none'});
    cond();el.querySelectorAll('select').forEach(x=>x.onchange=cond);
    const read=()=>Object.fromEntries(fields.map(f=>[f.name,el.querySelector(`[name="${f.name}"]`).value.trim()]));
    el.querySelector('[data-save]').onclick=()=>{const v=read();if(fields.some(f=>f.required&&!v[f.name])){toast('Name is required');return}closeSheet();onSave(v)};
    el.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')el.querySelector('[data-save]').click()});
    if(onDelete)el.querySelector('[data-del]').onclick=()=>{closeSheet();onDelete()};
  });
}

    ${cats.length>1?`<div class="chips" style="padding-bottom:8px">${cats.map(c=>`<button class="pill ${c.id===cat.id?'acc':''}" data-cat="${c.id}">${esc(c.name)}</button>`).join('')}</div>`:''}

    ${quickCats().map(c=>{const qs=sortedItems(c);return qs.length?`<div class="label" style="padding-top:14px">${esc(c.name)}</div><div class="chips" style="padding-bottom:0">${qs.map(i=>{const on=draft.some(t=>t.item===i.id);return `<button class="pill ${on?'acc':''}" data-quick="${i.id}">${esc(i.name)}${on?' ✓':''}</button>`}).join('')}</div>`:''}).join('')}
    <div style="padding:16px 20px 0"><button class="btn pri" style="width:100%" data-done>Apply</button></div>`;
    const B=$('#tagBody');
    B.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{const id=b.dataset.quick;const k=draft.findIndex(t=>t.item===id);if(k>=0)draft.splice(k,1);else draft.push({item:id,sub:null});paint()});

    B.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{const i=itemById(b.dataset.item);if(!i.subs.length){const k=draft.findIndex(t=>t.item===i.id);if(k>=0)draft.splice(k,1);else draft.push({item:i.id,sub:null});itemId=null}else itemId=i.id;paint()});

    B.querySelector('[data-done]').onclick=()=>{closeSheet();onDone(draft)};

function openViewer(id,list){
  if(!photoById(id))return;
  list=(list&&list.length?list:[id]).filter(photoById);if(!list.includes(id))list=[id,...list];
  const step=d=>{const i=list.indexOf(id)+d;if(i<0||i>=list.length){toast(d>0?'Last photo':'First photo');return}id=list[i];paint()};

function dataJSON(){return {version:1,exported:new Date().toISOString(),cats:S.cats,items:S.items,photos:S.photos.map(p=>({id:p.id,name:p.name,added:p.added,imported:p.imported,w:p.w,h:p.h,hash:p.hash,fav:p.fav,tags:p.tags,file:'photos/'+p.id+'.jpg',orig:p.orig?{w:p.orig.w,h:p.orig.h,hash:p.orig.hash,file:'originals/'+p.id+'.jpg'}:null}))}}
async function buildZip(photos,withData){
  const z=new JSZip();if(withData)z.file('data.json',JSON.stringify(dataJSON(),null,1));
  const f=z.folder('photos');for(const p of photos)f.file(p.id+'.jpg',p.full);
  if(withData){const o=z.folder('originals');for(const p of photos)if(p.orig&&(p.orig.buf||p.orig.full))o.file(p.id+'.jpg',p.orig.buf||p.orig.full)}
  return z.generateAsync({type:'blob',compression:'STORE'});
}
async function shareOrDownload(blob,name){
  const file=new File([blob],name,{type:'application/zip'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
}
async function importZip(file){
  showProgress(0,1);
  try{
    const z=await JSZip.loadAsync(file);const dj=z.file('data.json');
    if(!dj){hideProgress();toast('Not a Photo Sorter backup');return}
    const d=JSON.parse(await dj.async('string'));let n=0,t=d.photos.length;
    for(const c of d.cats)if(!catById(c.id)){await saveCat(c);S.cats.push(c)}
    for(const i of d.items){const ex=itemById(i.id);if(!ex){await saveItem(i);S.items.push(i)}}
    for(const q of d.photos){showProgress(++n,t);if(photoById(q.id))continue;const zf=z.file(q.file);if(!zf)continue;const full=await zf.async('blob');const im=await loadImage(full);const thumb=await toBlob(draw(im,320),.8);const p={...q,full:new Blob([full],{type:'image/jpeg'}),thumb};delete p.file;if(q.orig){const of=z.file(q.orig.file);p.orig=of?{w:q.orig.w,h:q.orig.h,hash:q.orig.hash,buf:await of.async('arraybuffer')}:null;if(!p.orig)delete p.orig}await saveBlobs(p);await savePhoto(p);S.photos.push(p)}
    S.photos.sort(byNewest);hideProgress();toast('Backup imported');render();
  }catch(e){hideProgress();toast('Could not read that file')}
}

async function deleteItem(it){

/* ---------- self-healing images ---------- */
// Safari can invalidate Blobs read from IndexedDB once their transaction closes; on a failed
// load, re-read the photo, rebuild the blob from bytes, and swap the URL in.
document.addEventListener('error',async e=>{
  const img=e.target;if(!(img instanceof HTMLImageElement)||!img.dataset.p)return;
  const id=img.dataset.p,k=img.dataset.k,tries=+(img.dataset.retry||0);if(tries>=2)return;img.dataset.retry=tries+1;
  try{
    const rec=await DB.get('blobs',id);if(!rec)return;const key=k==='f'?'full':'thumb';
    const b=await fresh(rec[key]);const p=photoById(id);if(p)p[key]=b;
    const uk=k+id;if(urls[uk]){URL.revokeObjectURL(urls[uk]);delete urls[uk]}urls[uk]=URL.createObjectURL(b);
    img.src=urls[uk];
  }catch(err){}
},true);

let lp;
document.addEventListener('pointerdown',e=>{const t=e.target.closest('.tile');if(!t||S.select||S.view!=='gallery')return;lp=setTimeout(()=>{S.select=new Set([t.dataset.id]);render();navigator.vibrate&&navigator.vibrate(10)},450)});
['pointerup','pointercancel','pointermove'].forEach(ev=>document.addEventListener(ev,()=>clearTimeout(lp)));

/* ---------- share-target inbox ---------- */
async function drainShareInbox(){
  if(!('caches' in window))return;
  try{const c=await caches.open('share-inbox');const keys=await c.keys();if(!keys.length)return;const files=[];for(const k of keys){const r=await c.match(k);const b=await r.blob();files.push(new File([b],k.url.split('/').pop()||'shared.jpg',{type:b.type||'image/jpeg'}));await c.delete(k)}if(files.length)await importFiles(files)}catch(e){}
}

/* ---------- pinch zoom ---------- */
function attachZoom(area,img,onSwipe){
  let scale=1,tx=0,ty=0,start=null,lastTap=0,swipeDx=0;
  img.style.transition='none';
  const apply=()=>{img.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`};
  const clamp=()=>{if(scale<=1){scale=1;tx=0;ty=0;return}const r=area.getBoundingClientRect(),iw=img.clientWidth*scale,ih=img.clientHeight*scale;const mx=Math.max(0,(iw-r.width)/2),my=Math.max(0,(ih-r.height)/2);tx=Math.min(mx,Math.max(-mx,tx));ty=Math.min(my,Math.max(-my,ty))};
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  area.addEventListener('touchstart',e=>{const t=e.touches;if(t.length===2)start={d:dist(t),s:scale,cx:(t[0].clientX+t[1].clientX)/2,cy:(t[0].clientY+t[1].clientY)/2,tx,ty};else if(t.length===1){start={x:t[0].clientX,y:t[0].clientY,tx,ty};const now=Date.now();if(now-lastTap<300){scale=scale>1?1:2.5;tx=0;ty=0;clamp();apply();start=null}lastTap=now}},{passive:true});
  area.addEventListener('touchmove',e=>{const t=e.touches;if(!start)return;e.preventDefault();if(t.length===2&&start.d){scale=Math.min(6,Math.max(1,start.s*dist(t)/start.d));const cx=(t[0].clientX+t[1].clientX)/2,cy=(t[0].clientY+t[1].clientY)/2;tx=start.tx+(cx-start.cx);ty=start.ty+(cy-start.cy)}else if(t.length===1&&start.x!==undefined&&scale>1){tx=start.tx+(t[0].clientX-start.x);ty=start.ty+(t[0].clientY-start.y)}else if(t.length===1&&start.x!==undefined&&scale===1&&onSwipe){const dx=t[0].clientX-start.x,dy=t[0].clientY-start.y;if(Math.abs(dx)>Math.abs(dy)){swipeDx=dx;img.style.transform=`translate(${dx}px,0) scale(1)`;img.style.opacity=String(Math.max(.4,1-Math.abs(dx)/400));return}}clamp();apply()},{passive:false});
  area.addEventListener('touchend',e=>{if(e.touches.length===0){start=null;if(scale===1&&onSwipe&&Math.abs(swipeDx)>0){const dx=swipeDx;swipeDx=0;if(Math.abs(dx)>70){onSwipe(dx<0?1:-1);return}img.style.transition='transform .18s';img.style.opacity='1';apply();setTimeout(()=>img.style.transition='none',200)}}else if(e.touches.length===1){const t=e.touches;start={x:t[0].clientX,y:t[0].clientY,tx,ty}}});
  area.addEventListener('wheel',e=>{e.preventDefault();scale=Math.min(6,Math.max(1,scale*(e.deltaY<0?1.1:0.9)));clamp();apply()},{passive:false});
}

/* ---------- crop / rotate editor ---------- */
async function openEditor(p,after,opts){
  const pick=opts&&opts.pick;const im=await loadImage(p.full);
  let rot=0,ratio=pick?pick.ratio:null;let crop=pick&&pick.crop?{...pick.crop}:{x:0,y:0,w:1,h:1}; // fractions of the rotated image
  const L=$('#layer');
  L.innerHTML=`<div class="editor"><div class="eh"><button class="icon-btn" data-e="cancel" aria-label="Cancel">${I.x}</button><div style="font-size:16px;font-weight:800">${pick?"Cover":"Edit"}</div><button class="pill on" data-e="save">${pick?"Use":"Save"}</button></div>
  <div style="flex:1;min-height:0;display:flex;align-items:center;justify-content:center"><canvas id="ecv"></canvas></div>
  ${pick?`<div class="note" style="text-align:center;padding-bottom:10px">Drag the box to choose what shows on the cover.</div>`:`<div class="chips" style="padding-top:10px;justify-content:center">${[['free','Free'],['1','1:1'],['0.8','4:5'],['0.5625','9:16'],['1.7778','16:9']].map(([v,l])=>`<button class="pill" data-r="${v}">${l}</button>`).join('')}</div>
  <div class="bar" style="background:none"><button class="btn" data-e="rotl">Rotate ⟲</button><button class="btn" data-e="rotr">Rotate ⟳</button><button class="btn" data-e="reset">Reset</button><button class="btn" data-e="copy">Save as copy</button></div>`}</div>`;
  const cv=$('#ecv'),ctx=cv.getContext('2d');
  const rw=()=>rot%180?im.naturalHeight:im.naturalWidth,rh=()=>rot%180?im.naturalWidth:im.naturalHeight;
  let box={x:0,y:0,w:0,h:0,s:1};
  function layout(){const host=cv.parentElement;const W=host.clientWidth-24,H=host.clientHeight-24;const s=Math.min(W/rw(),H/rh());cv.width=Math.round(rw()*s);cv.height=Math.round(rh()*s);box={s,w:cv.width,h:cv.height};cv.style.width=cv.width+'px';cv.style.height=cv.height+'px';draw()}
  function drawImage(c,sx,sy,sw,sh,dw,dh){c.save();c.translate(dw/2,dh/2);c.rotate(rot*Math.PI/180);const iw=rot%180?dh:dw,ih=rot%180?dw:dh;c.drawImage(im,sx,sy,sw,sh,-iw/2,-ih/2,iw,ih);c.restore()}
  function draw(){ctx.clearRect(0,0,cv.width,cv.height);drawImage(ctx,0,0,im.naturalWidth,im.naturalHeight,cv.width,cv.height);
    const X=crop.x*cv.width,Y=crop.y*cv.height,W=crop.w*cv.width,H=crop.h*cv.height;
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,cv.width,Y);ctx.fillRect(0,Y+H,cv.width,cv.height-Y-H);ctx.fillRect(0,Y,X,H);ctx.fillRect(X+W,Y,cv.width-X-W,H);
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(X,Y,W,H);ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1;for(let i=1;i<3;i++){ctx.beginPath();ctx.moveTo(X+W*i/3,Y);ctx.lineTo(X+W*i/3,Y+H);ctx.moveTo(X,Y+H*i/3);ctx.lineTo(X+W,Y+H*i/3);ctx.stroke()}
    ctx.fillStyle='#ff7a59';[[X,Y],[X+W,Y],[X,Y+H],[X+W,Y+H]].forEach(([a,b])=>{ctx.beginPath();ctx.arc(a,b,9,0,7);ctx.fill()})}
  function applyRatio(){if(!ratio)return;const iw=rw(),ih=rh();let w=crop.w*iw,h=w/ratio;if(h>crop.h*ih){h=crop.h*ih;w=h*ratio}if(w>iw){w=iw;h=w/ratio}if(h>ih){h=ih;w=h*ratio}crop.w=w/iw;crop.h=h/ih;crop.x=Math.min(crop.x,1-crop.w);crop.y=Math.min(crop.y,1-crop.h)}
  let drag=null;const MIN=0.08;
  cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)/cv.width,y=(e.clientY-r.top)/cv.height;const near=(a,b)=>Math.hypot((x-a)*cv.width,(y-b)*cv.height)<24;
    const c={...crop};let mode=null;if(near(c.x,c.y))mode='tl';else if(near(c.x+c.w,c.y))mode='tr';else if(near(c.x,c.y+c.h))mode='bl';else if(near(c.x+c.w,c.y+c.h))mode='br';else if(x>c.x&&x<c.x+c.w&&y>c.y&&y<c.y+c.h)mode='move';
    if(mode)drag={mode,x,y,c}});
  cv.addEventListener('pointermove',e=>{if(!drag)return;const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)/cv.width,y=(e.clientY-r.top)/cv.height;const dx=x-drag.x,dy=y-drag.y;const c=drag.c;let n={...c};
    if(drag.mode==='move'){n.x=Math.min(1-c.w,Math.max(0,c.x+dx));n.y=Math.min(1-c.h,Math.max(0,c.y+dy))}
    else{const right=drag.mode[1]==='r',bottom=drag.mode[0]==='b';
      if(right)n.w=Math.min(1-c.x,Math.max(MIN,c.w+dx));else{const nx=Math.min(c.x+c.w-MIN,Math.max(0,c.x+dx));n.w=c.w+(c.x-nx);n.x=nx}
      if(bottom)n.h=Math.min(1-c.y,Math.max(MIN,c.h+dy));else{const ny=Math.min(c.y+c.h-MIN,Math.max(0,c.y+dy));n.h=c.h+(c.y-ny);n.y=ny}
      if(ratio){const iw=rw(),ih=rh();let w=n.w*iw,h=w/ratio;if(n.y+h/ih>1||(!bottom&&c.y+c.h-h/ih<0)){h=bottom?(1-n.y)*ih:(c.y+c.h)*ih;w=h*ratio}n.w=w/iw;n.h=h/ih;if(!right)n.x=c.x+c.w-n.w;if(!bottom)n.y=c.y+c.h-n.h;if(n.x<0||n.x+n.w>1){return}}}
    crop=n;draw()});
  const end=()=>drag=null;cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  if(pick){if(!pick.crop){crop={x:0,y:0,w:1,h:1};applyRatio();crop.x=(1-crop.w)/2;crop.y=(1-crop.h)/2}}
  L.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{L.querySelectorAll('[data-r]').forEach(x=>x.classList.remove('on'));b.classList.add('on');ratio=b.dataset.r==='free'?null:+b.dataset.r;applyRatio();draw()});
  const on=(sel,fn)=>{const el=L.querySelector(sel);if(el)el.onclick=fn};
  on('[data-e="rotl"]',()=>{rot=(rot+270)%360;crop={x:0,y:0,w:1,h:1};layout()});
  on('[data-e="rotr"]',()=>{rot=(rot+90)%360;crop={x:0,y:0,w:1,h:1};layout()});
  on('[data-e="reset"]',()=>{rot=0;ratio=null;crop={x:0,y:0,w:1,h:1};L.querySelectorAll('[data-r]').forEach(x=>x.classList.remove('on'));layout()});
  L.querySelector('[data-e="cancel"]').onclick=()=>{L.innerHTML='';after()};
  async function commit(asCopy){
    const W=Math.round(crop.w*rw()),H=Math.round(crop.h*rh());
    // render rotated full image, then cut the crop
    const full=document.createElement('canvas');full.width=rw();full.height=rh();drawImage(full.getContext('2d'),0,0,im.naturalWidth,im.naturalHeight,full.width,full.height);
    const out=document.createElement('canvas');out.width=W;out.height=H;out.getContext('2d').drawImage(full,Math.round(crop.x*rw()),Math.round(crop.y*rh()),W,H,0,0,W,H);
    const blob=await toBlob(out,.9);const im2=await loadImage(blob);
    const fullB=await toBlob(draw2(im2,2000),.86),thumbB=await toBlob(draw2(im2,320),.8);
    let orig=p.orig||{buf:await p.full.arrayBuffer(),w:p.w,h:p.h,hash:p.hash};
    if(orig.full&&!orig.buf){try{orig={buf:await orig.full.arrayBuffer(),w:orig.w,h:orig.h,hash:orig.hash}}catch(e){orig={buf:await p.full.arrayBuffer(),w:p.w,h:p.h,hash:p.hash}}}
    const target=asCopy?{...p,id:uid(),name:p.name.replace(/(\.\w+)?$/,' (edited)$1'),imported:Date.now(),tags:p.tags.map(t=>({...t}))}:p;
    target.orig=orig;
    Object.assign(target,{full:fullB,thumb:thumbB,w:im2.naturalWidth,h:im2.naturalHeight,hash:dhash(im2)});
    ['t','f'].forEach(k=>{if(urls[k+target.id]){URL.revokeObjectURL(urls[k+target.id]);delete urls[k+target.id]}});
    await saveBlobs(target);await savePhoto(target);if(asCopy){S.photos.push(target);S.photos.sort(byNewest)}
    L.innerHTML='';toast(asCopy?'Saved as copy':'Photo updated');if(asCopy){render();openViewer(target.id)}else after();
  }
  const draw2=draw_;
  on('[data-e="save"]',()=>{if(pick){L.innerHTML='';pick.onPick({x:crop.x,y:crop.y,w:crop.w,h:crop.h})}else commit(false)});
  on('[data-e="copy"]',()=>commit(true));
  requestAnimationFrame(layout);
}
const draw_=(im,max)=>draw(im,max);

$('#picker').onchange=e=>{importFiles(e.target.files);e.target.value=''};
$('#zipPicker').onchange=e=>{if(e.target.files[0])importZip(e.target.files[0]);e.target.value=''};
(async()=>{
  await load();render();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
  drainShareInbox();
