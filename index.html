<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sorter">
<title>Photo Sorter</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#111114;--bg2:#16161a;--sur:#1c1c21;--sur2:#24242b;--sur3:#2a2a33;--sur4:#34343e;
  --line:#24242b;--txt:#f2f2f4;--txt2:#c5c5cf;--mut:#9a9aa6;--acc:#ff7a59;--acc2:#ff8a66;--star:#ffd166;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font-family:Manrope,system-ui,-apple-system,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
input,select{background:var(--sur2);border:0;border-radius:12px;padding:12px 14px;width:100%;color:var(--txt);font-weight:600;outline:none;-webkit-user-select:text;user-select:text}
input:focus,select:focus{box-shadow:0 0 0 2px var(--acc)}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#app{flex:1;display:flex;flex-direction:column;min-height:0}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:24px;position:relative}
.head{padding:calc(var(--sat) + 14px) 20px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0}
.title{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0}
.title.sm{font-size:20px}
.icon-btn{width:44px;height:44px;border-radius:22px;background:var(--sur);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn.acc{background:var(--acc);color:#111114}
.pill{height:36px;padding:0 14px;border-radius:18px;background:var(--sur);font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;color:var(--txt2);flex-shrink:0;white-space:nowrap}
.pill.on{background:var(--txt);color:#111114}
.pill.acc{background:var(--acc);color:#111114}
.pill.tall{height:40px}
.chips{display:flex;gap:8px;padding:0 20px 14px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.chips::-webkit-scrollbar{display:none}
.label{font-size:13px;font-weight:800;color:var(--mut);padding:0 20px 8px}
.row-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 20px 8px}
.link{color:var(--acc2);font-size:13px;font-weight:700}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;padding:0 20px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 20px}
.tile{display:flex;flex-direction:column;gap:3px;background:none;text-align:left;color:inherit;min-width:0}
.tile .img{position:relative;aspect-ratio:1;background:var(--sur2);border-radius:4px;overflow:hidden}
.tile .img img{width:100%;height:100%;object-fit:cover;display:block}
.tile .img img:not([src]){visibility:hidden}
.badge{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.65);color:#fff;font-size:10px;font-weight:800;padding:2px 6px;border-radius:8px;letter-spacing:.02em}
.viewer video,.stage video{max-width:100%;max-height:100%;display:block;background:#000}
.tile.sel .img{outline:3px solid var(--acc);outline-offset:-3px}
.tile .ind{display:flex;gap:3px;align-items:center;height:12px}
.dot{width:8px;height:8px;border-radius:4px;flex-shrink:0}
.chk{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:11px;border:2px solid #fff;opacity:.85}
.tile.sel .chk{background:var(--acc);border-color:var(--acc);display:flex;align-items:center;justify-content:center;opacity:1}
.card{display:flex;flex-direction:column;gap:8px;text-align:left;color:inherit;min-width:0}
.card .cov{aspect-ratio:1;border-radius:16px;background:var(--sur2);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;color:#111114;position:relative}
.card .cov img{width:100%;height:100%;object-fit:cover;display:block}
.card .nm{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .mt{font-size:12px;font-weight:600;color:var(--mut)}
.card.dim{opacity:.55}
.card.hide .cov{outline:2px dashed var(--acc2);outline-offset:-2px;opacity:.5}
.fbar{display:flex;gap:6px;flex-wrap:wrap;padding:0 20px 10px}
.fbar .tag{background:var(--sur3)}
.fbar .tag.neg{background:#3a2622;color:var(--acc2)}
.pill.hide{text-decoration:line-through;color:var(--acc2);background:var(--sur)}
.month{font-size:13px;font-weight:800;color:var(--mut);padding:10px 20px 8px;display:flex;justify-content:space-between;align-items:baseline;height:36px}
.tabbar{display:flex;justify-content:space-around;align-items:flex-start;border-top:1px solid var(--line);padding:10px 4px calc(var(--sab) + 12px);background:var(--bg2);flex-shrink:0}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;width:64px;color:var(--mut);font-size:11px;font-weight:700;text-decoration:none}
.tab.on{color:var(--acc);font-weight:800}
.tab .fab{width:44px;height:44px;border-radius:22px;background:var(--acc);display:flex;align-items:center;justify-content:center;margin-top:-18px;color:#111114}
.bar{display:flex;gap:10px;padding:12px 20px calc(var(--sab) + 14px);flex-shrink:0;background:var(--bg)}
.btn{height:52px;border-radius:16px;background:var(--sur);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;flex:1}
.btn.pri{background:var(--acc);color:#111114;font-weight:800;flex:2}
.btn.sm{height:40px;font-size:13px;border-radius:12px;padding:0 12px;flex:0 0 auto}
.btn.danger{color:var(--acc2)}
.btn:disabled{opacity:.4}
.stage{margin:0 20px;border-radius:20px;background:var(--sur2);overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:height .2s}
.stage img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:10px 20px 0;min-height:38px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border-radius:14px;background:var(--sur3);font-size:12px;font-weight:700}
.tag .x{width:16px;height:16px;border-radius:8px;background:var(--sur4);display:flex;align-items:center;justify-content:center;color:var(--txt2)}
.hrow{display:flex;gap:12px;padding:0 20px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.hrow::-webkit-scrollbar{display:none}
.av{display:flex;flex-direction:column;align-items:center;gap:6px;width:70px;flex-shrink:0;color:var(--txt2);font-size:12px;font-weight:600}
.av .c{width:64px;height:64px;border-radius:32px;background:var(--sur3);border:3px solid transparent;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#111114;overflow:hidden;position:relative}
.av .c img{width:100%;height:100%;object-fit:cover}
.av.on{color:var(--txt);font-weight:700}
.av.on .c{border-color:var(--txt);box-shadow:0 0 0 3px var(--acc)}
.sq{display:flex;flex-direction:column;gap:6px;width:96px;flex-shrink:0;color:var(--txt2);font-size:12px;font-weight:600;text-align:left}
.sq .c{width:96px;height:96px;border-radius:14px;background:var(--sur3);border:2px solid transparent;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:11px;position:relative}
.sq .c img{width:100%;height:100%;object-fit:cover}
.sq.on{color:var(--txt);font-weight:700}
.sq.on .c{border-color:var(--acc)}
.list{margin:0 20px;border-radius:16px;overflow:hidden;background:var(--sur)}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--bg);width:100%;text-align:left;color:inherit}
.li:last-child{border-bottom:0}
.li .t{font-size:15px;font-weight:700}
.li .s{font-size:12px;font-weight:600;color:var(--mut);margin-top:2px}
.sw{width:46px;height:28px;border-radius:14px;background:var(--sur4);position:relative;flex-shrink:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:12px;background:var(--mut);transition:transform .15s}
.sw.on{background:var(--acc)}.sw.on::after{background:#111114;transform:translateX(18px)}
.seg{display:flex;background:var(--sur);border-radius:12px;padding:3px;margin:0 20px 16px}
.seg button{flex:1;height:38px;border-radius:10px;font-size:13px;font-weight:700;color:var(--mut)}
.seg button.on{background:var(--sur4);color:var(--txt)}
.empty{padding:40px 30px;text-align:center;color:var(--mut);font-size:14px;font-weight:600;line-height:1.5}
.note{font-size:12px;font-weight:600;color:var(--mut);padding:10px 20px 0;line-height:1.4}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--bg2);border-radius:22px 22px 0 0;width:100%;max-height:88%;display:flex;flex-direction:column;padding-bottom:var(--sab)}
.sheet .h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 8px}
.sheet .h h2{margin:0;font-size:18px;font-weight:800}
.sheet .b{overflow-y:auto;padding:8px 0 12px;flex:1;min-height:0}
.sheet .sh{flex-shrink:0;padding-bottom:4px}
.sheet .sf{flex-shrink:0;padding:10px 20px 6px;display:flex;gap:8px;border-top:1px solid var(--line);background:var(--bg2)}
.viewer{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column}
.viewer .vh{display:flex;justify-content:space-between;padding:calc(var(--sat) + 10px) 14px 8px}
.viewer .vi{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.viewer .vi img{max-width:100%;max-height:100%;object-fit:contain}
.viewer .vf{padding:8px 0 calc(var(--sab) + 10px);background:rgba(17,17,20,.9)}
.viewer.immersive .vh,.viewer.immersive .vf{display:none}
#peek{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;pointer-events:none}
#peek img,#peek video{max-width:80vw;max-height:80vh;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 90px);transform:translateX(-50%);background:var(--txt);color:#111114;padding:10px 12px 10px 16px;border-radius:14px;font-size:13px;font-weight:700;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;display:flex;align-items:center;gap:12px;max-width:calc(100% - 40px)}
.toast.on{opacity:1;pointer-events:auto}
.toast button{background:#111114;color:#fff;border-radius:10px;padding:6px 10px;font-weight:800;font-size:12px}
.form{display:flex;flex-direction:column;gap:12px;padding:8px 20px 16px}
.form label{font-size:12px;font-weight:700;color:var(--mut);display:flex;flex-direction:column;gap:6px}
.spin{width:22px;height:22px;border:3px solid var(--sur4);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;flex-shrink:0}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.editor{position:fixed;inset:0;background:#000;z-index:35;display:flex;flex-direction:column}
.editor canvas{touch-action:none;display:block}
.editor .eh{display:flex;justify-content:space-between;align-items:center;padding:calc(var(--sat) + 10px) 14px 8px;color:var(--txt)}
.progress{position:fixed;top:0;left:0;right:0;padding:calc(var(--sat) + 10px) 20px 10px;background:var(--bg2);z-index:50;display:flex;align-items:center;gap:12px;font-size:13px;font-weight:700;border-bottom:1px solid var(--line)}
.banner{position:fixed;top:0;left:0;right:0;padding:calc(var(--sat) + 10px) 20px 10px;background:var(--acc);color:#111114;z-index:45;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;font-weight:800}
.banner button{background:#111114;color:#fff;border-radius:10px;padding:8px 12px;font-weight:800;font-size:12px}
.search{display:flex;align-items:center;gap:8px;padding:0 20px 12px}
.search input{height:44px;border-radius:14px}
.drag-li{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--sur);border-bottom:1px solid var(--bg);touch-action:none}
.drag-li.moving{background:var(--sur3);box-shadow:0 8px 24px rgba(0,0,0,.5);position:relative;z-index:2}
.handle{color:var(--mut);display:flex;align-items:center;padding:6px}
.vg{position:relative}
.meter{height:8px;border-radius:4px;background:var(--sur3);overflow:hidden;margin:8px 0 4px}
.meter div{height:100%;background:var(--acc)}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<div class="toast" id="toast"></div>
<input type="file" id="picker" accept="image/*,video/*" multiple hidden>
<input type="file" id="zipPicker" accept=".zip,application/zip" hidden>
<script>
/* ---------- tiny helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const PALETTE=['#ff7a59','#5aa9ff','#c99bff','#ffd166','#7fd18c','#ff9ec4','#6ee7d8','#f4a261'];
const colorFor=id=>{let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))>>>0;return PALETTE[h%PALETTE.length]};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fmtMB=b=>b>=1073741824?(b/1073741824).toFixed(2)+' GB':(b/1048576).toFixed(b>=104857600?0:1)+' MB';
let toastT;
function toast(m,undoFn,ms){const t=$('#toast');t.innerHTML=`<span>${esc(m)}</span>${undoFn?'<button data-undo>Undo</button>':''}`;if(undoFn)t.querySelector('[data-undo]').onclick=()=>{t.classList.remove('on');undoFn()};t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),ms||(undoFn?7000:1800))}
const I={
 plus:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
 x:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
 chev:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
 check:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>',
 gal:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
 person:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>',
 star:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.4 6.3 20.5l1.2-6.4L2.8 9.7l6.4-.8z"/></svg>',
 starF:'<svg width="22" height="22" viewBox="0 0 24 24" fill="#ffd166" stroke="#ffd166" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.4 6.3 20.5l1.2-6.4L2.8 9.7l6.4-.8z"/></svg>',
 starS:'<svg width="12" height="12" viewBox="0 0 24 24" fill="#ffd166" stroke="none"><path d="M12 3l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.4 6.3 20.5l1.2-6.4L2.8 9.7l6.4-.8z"/></svg>',
 sort:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h10M4 17h6"/><path d="M17 15l3 3-3 3"/></svg>',
 more:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>',
 shuffle:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h4l10 10h4M3 17h4l10-10h4"/><path d="M18 4l3 3-3 3M18 14l3 3-3 3"/></svg>',
 trash:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
 edit:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10-4-4L4 16v4z"/><path d="M12 8l4 4"/></svg>',
 tagI:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V4h8l9 9-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/></svg>',

 search:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
 grip:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M8 6h.01M8 12h.01M8 18h.01M16 6h.01M16 12h.01M16 18h.01"/></svg>',
 prev:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
 filter:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg>',
 img:'<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg>',
};

/* ---------- IndexedDB ----------
   photos: metadata only · thumbs: {id,thumb} · blobs: {id,full,orig} · items · cats · meta
   Image blobs are written once (import / edit / revert) and never re-put: Safari corrupts
   a Blob that is read from IndexedDB and stored again. */
const DB=(()=>{
  let db;
  const open=()=>new Promise((res,rej)=>{
    const r=indexedDB.open('photosorter',3);
    r.onupgradeneeded=e=>{const d=e.target.result;const has=n=>d.objectStoreNames.contains(n);
      for(const n of ['photos','items','cats','blobs','thumbs'])if(!has(n))d.createObjectStore(n,{keyPath:'id'});
      if(!has('meta'))d.createObjectStore('meta',{keyPath:'k'});};
    r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));
  });

        p={id:uid(),name:f.name,added:shot||f.lastModified||Date.now(),imported:Date.now(),batch,src:srcKey(f),w:im.naturalWidth,h:im.naturalHeight,hash:dhash(im),fav:false,tags:[],hasOrig:false,bytes:full.size};

async function importImageZip(z){

/* ---------- virtual grid ----------
   A grid is described as rows (header rows + tile rows). Only rows near the viewport exist in
   the DOM, so 20k photos cost nothing until scrolled to. */
const grids={};
function vgrid(key,photos,{cols=3,gap=3,group=null,selSet=null,indH=15}={}){
  const rows=[];
  const push=(ps)=>{for(let i=0;i<ps.length;i+=cols)rows.push({t:'tiles',ids:ps.slice(i,i+cols).map(p=>p.id)})};
  if(group){const g=new Map();for(const p of photos){const k=group(p);if(!g.has(k))g.set(k,[]);g.get(k).push(p)}
    for(const [k,ps] of g){rows.push({t:'head',k,ids:ps.map(p=>p.id)});push(ps)}}
  else push(photos);
  grids[key]={rows,cols,gap,selSet,indH,first:-1,last:-1};
  return `<div class="vg" data-vg="${key}"></div>`;
}
function mountGrids(){
  const sc=$('#app .scroll');if(!sc)return;
  const els=[...sc.querySelectorAll('[data-vg]')];if(!els.length)return;
  const W=sc.clientWidth||390;
  for(const el of els){const g=grids[el.dataset.vg];if(!g)continue;g.el=el;g.tileH=Math.floor((W-40-g.gap*(g.cols-1))/g.cols)+g.gap+g.indH;g.headH=36;
    let y=0;g.offs=g.rows.map(r=>{const o=y;y+=r.t==='head'?g.headH:g.tileH;return o});g.total=y;el.style.height=g.total+'px';g.first=-1;g.last=-1}
  const upd=()=>{for(const el of els){const g=grids[el.dataset.vg];if(!g||!el.isConnected)continue;paintGrid(g,sc)}};
  sc.onscroll=()=>{if(sc._raf)return;sc._raf=requestAnimationFrame(()=>{sc._raf=null;upd()})};
  upd();
}
function paintGrid(g,sc){
  const vh=Math.max(sc.clientHeight||0,600);const top=g.el.offsetTop;const vt=sc.scrollTop-top,vb=vt+vh;const buf=vh;
  let first=0;while(first<g.rows.length-1&&g.offs[first+1]<vt-buf)first++;
  let last=first;while(last<g.rows.length-1&&g.offs[last]<vb+buf)last++;
  if(first===g.first&&last===g.last)return;g.first=first;g.last=last;
  let h='';const sel=S.select;
  for(let i=first;i<=last;i++){const r=g.rows[i];const y=g.offs[i];
    if(r.t==='head'){const allIn=sel&&r.ids.every(id=>sel.has(id));h+=`<div class="month" style="position:absolute;left:0;right:0;top:${y}px"><span>${esc(r.k)}</span>${sel?`<button class="link" data-act="selGroup" data-ids="${r.ids.join(',')}">${allIn?'Deselect':'Select'} ${r.ids.length}</button>`:`<span style="font-weight:600">${r.ids.length}</span>`}</div>`}
    else{h+=`<div style="position:absolute;left:20px;right:20px;top:${y}px;display:grid;grid-template-columns:repeat(${g.cols},minmax(0,1fr));gap:${g.gap}px">${r.ids.map(id=>{const p=photoById(id);return p?tileHTML(p,sel&&sel.has(id)):''}).join('')}</div>`}
  }
  g.el.innerHTML=h;
  g.el.querySelectorAll('[data-act]').forEach(b=>b.onclick=e=>actions[b.dataset.act]&&actions[b.dataset.act](b,e));
  hydrate(g.el);
}
function repaintGrids(){for(const k in grids){const g=grids[k];if(g.el&&g.el.isConnected){g.first=-1;paintGrid(g,$('#app .scroll'))}}}

<script>
function mediaEl(p,attrs=''){return p.kind==='video'?`<video data-p="${p.id}" data-k="f" muted playsinline autoplay loop ${attrs}></video>`:`<img alt="" data-p="${p.id}" data-k="f" ${attrs}>`}
/* ---------- Sort mode ---------- */
function sortFilters(){
  const f=[{k:'unsorted',l:'Unsorted',fn:p=>!p.tags.length}];
  if(S.lastBatch)f.push({k:'last',l:'Last import',fn:p=>p.batch===S.lastBatch});
  for(const c of enabledCats()){const ids=new Set(itemsOf(c.id).map(i=>i.id));if(ids.size)f.push({k:'nocat:'+c.id,l:'No '+c.name.toLowerCase(),fn:p=>!p.tags.some(t=>ids.has(t.item))})}
  for(const i of S.items)if(i.subs.length){const c=catById(i.cat);f.push({k:'nosub:'+i.id,l:i.name+' · no '+singular(c.subLabel.toLowerCase()),fn:p=>p.tags.some(t=>t.item===i.id)&&!p.tags.some(t=>t.item===i.id&&t.sub)})}
  for(const c of enabledCats()){const g=groupCatOf(c);if(!g)continue;const ids=new Set(itemsOf(c.id).map(i=>i.id));for(const gi of itemsOf(g.id))if(count(gi.id))f.push({k:'nogroup:'+gi.id+':'+c.id,l:gi.name+' · no '+c.name.toLowerCase(),fn:p=>p.tags.some(t=>t.item===gi.id)&&!p.tags.some(t=>ids.has(t.item))})}
  f.push({k:'all',l:'Everything',fn:()=>true});
  return f;
}
function startSort(filter){

  loadDraft();go('sort');
}
function loadDraft(){const p=photoById(S.sortQueue[S.sortIdx]);S.draft=p?p.tags.map(t=>({...t})):[];S.sortCat=(S.sortCat&&mainCats().some(c=>c.id===S.sortCat))?S.sortCat:(primaryCat()&&primaryCat().id);const it=S.sortItem&&itemById(S.sortItem);if(!it||it.cat!==S.sortCat)S.sortItem=null}
function recentFirst(its){const r=new Map(S.recent.map((id,i)=>[id,i]));return its.slice().sort((a,b)=>{const ra=r.has(a.id)?r.get(a.id):1e9,rb=r.has(b.id)?r.get(b.id):1e9;return ra-rb||a.order-b.order})}
function sortView(){
  const p=photoById(S.sortQueue[S.sortIdx]);const fs=sortFilters();const cur=fs.find(f=>f.k===S.sortFilter);
  const chips=`<div class="chips"><button class="pill on" data-act="sortFilterSheet">${I.filter}${esc(cur?cur.l:'Filter')}</button>${fs.slice(0,2).filter(f=>f.k!==S.sortFilter).map(f=>`<button class="pill" data-act="sortFilter" data-k="${f.k}">${esc(f.l)}</button>`).join('')}</div>`;
  const head=`<div class="head"><div style="display:flex;align-items:center;gap:10px"><button class="icon-btn" data-act="closeSort" aria-label="Close">${I.x}</button><div style="font-size:18px;font-weight:800">Sort</div></div><div style="font-size:14px;font-weight:600;color:var(--mut)">${p?`${S.sortIdx+1} of ${S.sortQueue.length}`:''}</div></div>`;
  if(!p)return `<div class="screen">${head}${chips}<div class="empty" style="flex:1">${S.sortQueue.length?'All done — every photo in this filter is sorted.':'Nothing matches this filter.'}<br>Pick another filter, or add more photos.</div>${S.sortIdx>0?`<div class="bar"><button class="btn" data-act="prev">${I.prev}Previous</button></div>`:''}${nav()}</div>`;
  const cats=mainCats();const cat=catById(S.sortCat)||cats[0];const its=recentFirst(sortedItems(cat));const it=itemById(S.sortItem);
  const catRow=cats.length>1?`<div class="chips" style="padding-bottom:8px">${cats.map(c=>`<button class="pill ${c.id===cat.id?'acc':''}" data-act="sortCat" data-k="${c.id}">${esc(c.name)}</button>`).join('')}</div>`:'';
  const itemRow=`<div class="row-head"><div class="label" style="padding:0">${esc(cat.name)}</div><button class="link" data-act="newItemSort">+ New</button></div><div class="hrow">${its.map(i=>{const on=it&&it.id===i.id;const tagged=S.draft.some(t=>t.item===i.id);return `<button class="av ${on?'on':''}" data-act="sortItem" data-id="${i.id}"><div class="c" style="background:${colorFor(i.id)}">${coverHTML(i.cover,i.name[0]||'?',i.coverCrop)}</div><div>${esc(i.name)}${tagged?' ✓':''}</div></button>`}).join('')||'<div class="note" style="padding:0">No items yet — tap + New.</div>'}</div>`;
  const subRow=it?`<div class="row-head" style="padding-top:14px"><div class="label" style="padding:0">${esc(it.name)} · ${esc(cat.subLabel.toLowerCase())}</div><button class="link" data-act="newSubSort">+ New</button></div><div class="hrow" style="gap:10px">${[{id:null,name:'No '+singular(cat.subLabel.toLowerCase())},...it.subs].map(s=>{const on=S.draft.some(t=>t.item===it.id&&(t.sub||null)===s.id);return `<button class="sq ${on?'on':''}" data-act="sortSub" data-id="${s.id||''}"><div class="c">${s.id?coverHTML(s.cover,'',s.coverCrop):'<span style="color:var(--mut)">—</span>'}</div><div>${esc(s.name)}${on?' ✓':''}</div></button>`}).join('')}</div>`:'';
  const tags=`<div class="tags">${S.draft.map((t,i)=>{const l=tagLabel(t);const c=colorFor(t.item);return l?`<button class="tag" data-act="draftRm" data-i="${i}"><span class="dot" style="background:${c}"></span>${esc(l)}<span class="x">${I.x.replace(/18/g,'10')}</span></button>`:''}).join('')||'<span style="font-size:12px;font-weight:600;color:var(--mut);align-self:center">No tags yet — pick below</span>'}</div>`;
  const changed=JSON.stringify(S.draft)!==JSON.stringify(p.tags);
  return `<div class="screen">${head}${chips}<div class="scroll" style="padding-bottom:8px"><button class="stage" id="sortStage" style="height:${it?'22vh':'36vh'};width:calc(100% - 40px)" data-act="openCur" aria-label="Open photo">${mediaEl(p)}</button><div style="text-align:center;font-size:12px;font-weight:600;color:var(--mut);padding-top:8px">${esc(p.name)}</div>${tags}<div style="height:12px"></div>${catRow}${itemRow}${subRow}${quickRows(S.draft,'sortQuick')}</div>
  <div class="bar"><button class="btn" style="flex:0 0 52px;padding:0" data-act="prev" aria-label="Previous" ${S.sortIdx>0?'':'disabled'}>${I.prev}</button><button class="btn" data-act="skip">Skip</button><button class="btn pri" data-act="saveNext">${changed||S.draft.length?'Save &amp; next':'Next'}</button></div></div>`;
}
function addTag(arr,itemId,subId){if(arr.some(t=>t.item===itemId&&(t.sub||null)===(subId||null)))return;if(!subId&&arr.some(t=>t.item===itemId))return;if(subId){const k=arr.findIndex(t=>t.item===itemId&&!t.sub);if(k>=0)arr.splice(k,1)}arr.push({item:itemId,sub:subId||null})}

function shufflePool(){const k=S.shufFilter;if(k==='fav')return S.photos.filter(p=>p.fav);if(k==='all')return S.photos;return S.photos.filter(p=>p.tags.some(t=>t.item===k))}

async function fillStorage(){

/* ---------- Duplicates ---------- */
function findDupes(){
  // bucket by 8-bit segments: two hashes within 6 bits always share at least two of eight segments
  const ps=S.photos.filter(p=>p.hash&&p.hash.length===64);const buckets=new Map();
  ps.forEach((p,i)=>{for(let s=0;s<8;s++){const k=s+':'+p.hash.slice(s*8,s*8+8);let a=buckets.get(k);if(!a)buckets.set(k,a=[]);a.push(i)}});
  const seen=new Set();const pairs=[];const used=new Set();
  for(const arr of buckets.values()){if(arr.length<2||arr.length>400)continue;for(let x=0;x<arr.length;x++)for(let y=x+1;y<arr.length;y++){const i=arr[x],j=arr[y];const key=i<j?i+'-'+j:j+'-'+i;if(seen.has(key))continue;seen.add(key);const d=hamming(ps[i].hash,ps[j].hash);if(d<=6){const a=ps[i],b=ps[j];if(used.has(a.id)||used.has(b.id))continue;used.add(b.id);pairs.push({a,b,d})}}}
  return pairs.map(({a,b,d})=>{const keep=(a.w*a.h)>=(b.w*b.h)?a:b;const rm=keep===a?b:a;return {keep,rm,d}});
}
function dupesView(){
  const pairs=S.dupePairs||(S.dupePairs=findDupes().filter(x=>!(S.notDupes||new Set()).has(x.keep.id+'|'+x.rm.id)));
  const show=pairs.slice(0,60);
  return `<div class="screen"><div class="head" style="justify-content:flex-start;gap:12px"><button class="icon-btn" data-act="back" aria-label="Back">${I.back}</button><h1 class="title sm">Duplicates</h1></div>
  <div class="scroll"><div class="note" style="padding-top:0;padding-bottom:14px">Compared by image hash. ${pairs.length} pair${pairs.length===1?'':'s'} found in ${S.photos.length} photos${pairs.length>60?' (showing the first 60)':''}. Tags and favorites on the removed copy move to the kept one.</div>
  ${show.length?show.map((x,i)=>`<div style="margin:0 20px 12px;padding:14px;border-radius:16px;background:var(--sur);display:flex;flex-direction:column;gap:10px"><div style="display:flex;gap:10px"><div style="flex:1"><button data-act="dupeOpen" data-id="${x.keep.id}" style="display:block;width:100%;aspect-ratio:1;border-radius:10px;overflow:hidden;outline:3px solid var(--acc);outline-offset:-3px;background:var(--sur2)"><img alt="" data-p="${x.keep.id}" data-k="t" style="width:100%;height:100%;object-fit:cover"></button><div style="font-size:11px;font-weight:700;padding-top:6px">Keep · ${x.keep.w}×${x.keep.h}</div></div><div style="flex:1"><button data-act="dupeOpen" data-id="${x.rm.id}" style="display:block;width:100%;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--sur2)"><img alt="" data-p="${x.rm.id}" data-k="t" style="width:100%;height:100%;object-fit:cover"></button><div style="font-size:11px;font-weight:600;color:var(--mut);padding-top:6px">Remove · ${x.rm.w}×${x.rm.h}</div></div></div><div style="display:flex;align-items:center;justify-content:space-between"><div style="font-size:12px;font-weight:600;color:var(--mut)">${x.d===0?'Exact match':'Near match'}</div><div style="display:flex;gap:6px"><button class="pill tall" data-act="dupeSwap" data-i="${i}">Swap</button><button class="pill tall" data-act="dupeNot" data-i="${i}">Not a dupe</button><button class="pill tall acc" data-act="dupeRemove" data-i="${i}">Remove</button></div></div></div>`).join(''):'<div class="empty">No duplicates found.</div>'}</div>
  <div class="bar"><button class="btn pri" data-act="dupeAll" ${pairs.length?'':'disabled'}>Remove all ${pairs.length}</button></div></div>`;
}
async function mergeRemove(keep,rm){
  for(const t of rm.tags)addTag(keep.tags,t.item,t.sub);
  keep.fav=keep.fav||rm.fav;await savePhoto(keep);
  for(const it of S.items){let ch=false;if(it.cover===rm.id){it.cover=keep.id;ch=true}for(const s of it.subs)if(s.cover===rm.id){s.cover=keep.id;ch=true}if(ch)await saveItem(it)}
  await deletePhotos([rm.id]);
}

/* ---------- sheets & dialogs ---------- */
function sheet(title,bodyHTML,onBind,opts={}){
  const L=$('#layer');L.innerHTML=`<div class="sheet-bg" data-close><div class="sheet"><div class="h"><h2>${title}</h2><button class="icon-btn" data-close aria-label="Close">${I.x}</button></div>${opts.sub?`<div class="sh">${opts.sub}</div>`:''}<div class="b">${bodyHTML}</div>${opts.foot?`<div class="sf">${opts.foot}</div>`:''}</div></div>`;
  L.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',e=>{if(b.classList.contains('sheet-bg')?e.target===b:true)closeSheet()}));
  onBind&&onBind(L.firstElementChild);hydrate(L);
}
function closeSheet(){$('#layer').innerHTML=''}
function ask(msg,{ok='OK',danger=false,single=false,title=''}={}){
  return new Promise(res=>{
    const prev=$('#layer').innerHTML;
    const L=$('#layer');const box=document.createElement('div');box.className='sheet-bg';box.style.zIndex=60;box.style.alignItems='center';box.style.padding='0 24px';
    box.innerHTML=`<div style="background:var(--bg2);border-radius:20px;padding:20px;width:100%;max-width:360px"><div style="font-size:15px;font-weight:600;line-height:1.45;white-space:pre-line">${esc(msg)}</div><div style="display:flex;gap:8px;margin-top:18px">${single?'':'<button class="btn" data-no style="height:46px">Cancel</button>'}<button class="btn ${danger?'':'pri'}" data-yes style="height:46px;${danger?'background:var(--acc);color:#111114;font-weight:800':''}">${esc(ok)}</button></div></div>`;
    document.body.appendChild(box);
    const done=v=>{box.remove();res(v)};
    box.querySelector('[data-yes]').onclick=()=>done(true);const no=box.querySelector('[data-no]');if(no)no.onclick=()=>done(false);
    box.onclick=e=>{if(e.target===box&&!single)done(false)};
  });
}
function formSheet(title,fields,onSave,onDelete,onCancel){
  const b=`<div class="form">${fields.map(f=>f.type==='select'?`<label>${esc(f.label)}<select name="${f.name}">${f.options.map(o=>`<option value="${esc(o.v)}" ${o.v===f.value?'selected':''}>${esc(o.l)}</option>`).join('')}</select></label>`:`<label>${esc(f.label)}<input name="${f.name}" value="${esc(f.value||'')}" placeholder="${esc(f.ph||'')}" autocomplete="off"></label>`).join('')}
  <button class="btn pri" data-save>Save</button>${onDelete?`<button class="btn danger" data-del>Delete</button>`:''}</div>`;
  sheet(title,b,el=>{
    const first=el.querySelector('input');first&&setTimeout(()=>first.focus(),50);
    const cond=()=>fields.forEach(f=>{if(!f.showIf)return;const [n,val]=f.showIf.split('=');const on=el.querySelector(`[name="${n}"]`).value===val;el.querySelector(`[name="${f.name}"]`).closest('label').style.display=on?'':'none'});
    cond();el.querySelectorAll('select').forEach(x=>x.onchange=cond);
    const read=()=>Object.fromEntries(fields.map(f=>[f.name,el.querySelector(`[name="${f.name}"]`).value.trim()]));
    el.querySelector('[data-save]').onclick=()=>{const v=read();if(fields.some(f=>f.required&&!v[f.name])){toast('Name is required');return}closeSheet();onSave(v)};
    el.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')el.querySelector('[data-save]').click()});
    if(onDelete)el.querySelector('[data-del]').onclick=()=>{closeSheet();onDelete()};
    if(onCancel)el.parentElement.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',e=>{if(b.classList.contains('sheet-bg')?e.target===b:true)onCancel()}));
  });
}
function tagSheet(title,initial,onDone,st){

    const cats=mainCats();const cat=catById(catId)||cats[0];catId=cat.id;const its=recentFirst(sortedItems(cat));const it=itemById(itemId);
    $('#tagBody').innerHTML=`<div class="tags" style="justify-content:flex-start">${draft.map((t,i)=>{const l=tagLabel(t);return l?`<button class="tag" data-rm="${i}"><span class="dot" style="background:${colorFor(t.item)}"></span>${esc(l)}<span class="x">${I.x.replace(/18/g,'10')}</span></button>`:''}).join('')||'<span style="font-size:12px;font-weight:600;color:var(--mut)">No tags yet</span>'}</div><div style="height:12px"></div>
    ${cats.length>1?`<div class="chips" style="padding-bottom:8px">${cats.map(c=>`<button class="pill ${c.id===cat.id?'acc':''}" data-cat="${c.id}">${esc(c.name)}</button>`).join('')}</div>`:''}
    <div class="row-head"><div class="label" style="padding:0">${esc(cat.name)}</div><button class="link" data-newitem>+ New ${esc(singular(cat.name.toLowerCase()))}</button></div><div class="hrow">${its.map(i=>`<button class="av ${it&&it.id===i.id?'on':''}" data-item="${i.id}"><div class="c" style="background:${colorFor(i.id)}">${coverHTML(i.cover,i.name[0]||'?',i.coverCrop)}</div><div>${esc(i.name)}${draft.some(t=>t.item===i.id)?' ✓':''}</div></button>`).join('')||'<div class="note" style="padding:0">No items in this category yet.</div>'}</div>
    ${[...new Set([...(it?[it.id]:[]),...draft.map(t=>t.item).filter(id=>{const x=itemById(id);return x&&x.cat===cat.id&&x.subs.length})])].map(itemById).map(x=>`<div class="row-head" style="padding-top:14px"><div class="label" style="padding:0">${esc(x.name)} · ${esc(cat.subLabel.toLowerCase())}</div><button class="link" data-newsub="${x.id}">+ New ${esc(singular(cat.subLabel.toLowerCase()))}</button></div><div class="hrow" style="gap:10px">${[{id:null,name:'No '+singular(cat.subLabel.toLowerCase())},...x.subs].map(s=>{const on=draft.some(t=>t.item===x.id&&(t.sub||null)===s.id);return `<button class="sq ${on?'on':''}" data-sub="${s.id||''}" data-of="${x.id}"><div class="c">${s.id?coverHTML(s.cover,'',s.coverCrop):'<span style="color:var(--mut)">—</span>'}</div><div>${esc(s.name)}${on?' ✓':''}</div></button>`}).join('')}</div>`).join('')}
    ${quickCats().map(c=>{const qs=sortedItems(c);return `<div class="row-head" style="padding-top:14px"><div class="label" style="padding:0">${esc(c.name)}</div><button class="link" data-newquick="${c.id}">+ New</button></div><div class="chips" style="padding-bottom:0">${qs.map(i=>{const on=draft.some(t=>t.item===i.id);return `<button class="pill ${on?'acc':''}" data-quick="${i.id}">${esc(i.name)}${on?' ✓':''}</button>`}).join('')||'<span class="note" style="padding:0">None yet</span>'}</div>`}).join('')}
`;
    const B=$('#tagBody');
    B.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{const id=b.dataset.quick;const k=draft.findIndex(t=>t.item===id);if(k>=0)draft.splice(k,1);else draft.push({item:id,sub:null});paint()});
    B.querySelectorAll('[data-rm]').forEach(b=>b.onclick=e=>{const t=draft[+b.dataset.rm];if(e.target.closest('.x')){draft.splice(+b.dataset.rm,1);paint();return}const it=itemById(t.item);if(it&&!catById(it.cat).quick){catId=it.cat;itemId=it.id;paint()}});
    B.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{catId=b.dataset.cat;itemId=null;paint()});
    B.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{const i=itemById(b.dataset.item);if(itemId===i.id&&i.subs.length){itemId=null}else{itemId=i.id;if(!i.subs.length){const k=draft.findIndex(t=>t.item===i.id);if(k>=0)draft.splice(k,1);else draft.push({item:i.id,sub:null})}}paint()});
    B.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{const sub=b.dataset.sub||null;const of=b.dataset.of;const k=draft.findIndex(t=>t.item===of&&(t.sub||null)===sub);if(k>=0)draft.splice(k,1);else addTag(draft,of,sub);paint()});
    $('#layer').querySelector('[data-done]').onclick=()=>{closeSheet();draft.forEach(t=>touchRecent(t.item));onDone(draft)};
    B.querySelector('[data-newitem]').onclick=()=>{closeSheet();itemForm(cat,null,ni=>{if(ni.subs.length)itemId=ni.id;else{addTag(draft,ni.id,null);itemId=null}reopen()},()=>reopen())};
    B.querySelectorAll('[data-newsub]').forEach(ns=>ns.onclick=()=>{const x=itemById(ns.dataset.newsub);closeSheet();subForm(x,null,sb=>{addTag(draft,x.id,sb.id);itemId=x.id;reopen()},()=>reopen())});

    hydrate(B);
  };
  sheet(title,'<div id="tagBody"></div>',paint,{foot:'<button class="btn pri" data-done style="height:48px">Apply</button>'});
}

   const pos=list.length>1?`${list.indexOf(id)+1} / ${list.length}`:'';
   $('#layer').innerHTML=`<div class="viewer"><div class="vh"><button class="icon-btn" data-v="close" aria-label="Close">${I.x}</button><div style="font-size:13px;font-weight:700;color:var(--mut);align-self:center">${pos}</div><button class="icon-btn" data-v="fav" aria-label="Favorite">${p.fav?I.starF:I.star}</button></div><div class="vi" id="zoomArea">${p.kind==='video'?`<video id="zoomVid" data-p="${p.id}" data-k="f" controls playsinline autoplay loop></video>`:''}<img alt="" id="zoomImg" data-p="${p.id}" data-k="f" style="touch-action:none;will-change:transform;${p.kind==='video'?'display:none':''}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'empty',textContent:'This photo could not be loaded. Tap Revert if it is available, otherwise re-import it.'}))"></div>

     sheet('Set as cover for',`<div class="list">${opts.map((o,i)=>`<button class="li" data-o="${i}"><div class="t">${esc(o.l)}</div>${I.chev}</button>`).join('')}</div>`,el=>el.querySelectorAll('[data-o]').forEach(b=>b.onclick=async()=>{const o=opts[+b.dataset.o];closeSheet();if(p.kind==='video'){await o.fn(null);toast('Cover updated');paint();return}pickCover(p,o.ratio,null,async crop=>{await o.fn(crop);toast('Cover updated');paint()},paint)}));

   L.querySelector('[data-v="del"]').onclick=async()=>{if(!await ask('Delete this photo from the app?',{ok:'Delete',danger:true}))return;const i=list.indexOf(id);const kept=await deletePhotos([p.id],true);list=list.filter(x=>x!==p.id);toast('Photo deleted',async()=>{await restorePhotos(kept);render()});if(!list.length){closeSheet();render();return}id=list[Math.min(i,list.length-1)];paint()};
  };
  paint();
}

/* ---------- hide sheet (Gallery) ---------- */
function hideSheet(){

/* ---------- manage sub-buckets (reorder / rename / delete) ---------- */
function subsManageSheet(it){
  const cat=catById(it.cat);
  const row=s=>`<div class="drag-li" data-id="${s.id}"><span class="handle">${I.grip}</span><div style="width:44px;height:33px;border-radius:8px;background:var(--sur3);overflow:hidden;position:relative;flex-shrink:0">${coverHTML(s.cover,'',s.coverCrop)}</div><button data-ren="${s.id}" style="flex:1;text-align:left;font-weight:700;color:inherit;min-width:0"><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.name)}</div><div style="font-size:12px;font-weight:600;color:var(--mut)">${subCount(it.id,s.id)} photos</div></button><button class="icon-btn" style="width:40px;height:40px;color:var(--acc2)" data-del="${s.id}" aria-label="Delete">${I.trash}</button></div>`;
  sheet(esc(cat.subLabel)+' · '+esc(it.name),`<div id="dl" style="margin:0 20px;border-radius:16px;overflow:hidden">${it.subs.map(row).join('')}</div>`,el=>{
    const L=el.querySelector('#dl');let drag=null;
    L.addEventListener('pointerdown',e=>{const h=e.target.closest('.handle');if(!h)return;const li=h.closest('.drag-li');li.setPointerCapture(e.pointerId);li.classList.add('moving');drag={li,y:e.clientY,h:li.offsetHeight};e.preventDefault()});
    L.addEventListener('pointermove',e=>{if(!drag)return;const dy=e.clientY-drag.y;drag.li.style.transform=`translateY(${dy}px)`;const sib=dy>0?drag.li.nextElementSibling:drag.li.previousElementSibling;if(sib&&Math.abs(dy)>drag.h*0.6){drag.li.style.transform='';drag.y=e.clientY;if(dy>0)sib.after(drag.li);else sib.before(drag.li)}});
    const end=async()=>{if(!drag)return;drag.li.classList.remove('moving');drag.li.style.transform='';drag=null;const ids=[...L.querySelectorAll('.drag-li')].map(x=>x.dataset.id);it.subs.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id));await saveItem(it)};
    L.addEventListener('pointerup',end);L.addEventListener('pointercancel',end);
    el.querySelectorAll('[data-ren]').forEach(b=>b.onclick=()=>{closeSheet();subForm(it,subOf(it,b.dataset.ren),()=>subsManageSheet(it),()=>subsManageSheet(it))});
    el.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{const sb=subOf(it,b.dataset.del);closeSheet();if(!await ask(`Delete ${sb.name}? Photos keep the ${it.name} tag.`,{ok:'Delete',danger:true})){subsManageSheet(it);return}for(const p of S.photos){let ch=false;p.tags.forEach(t=>{if(t.item===it.id&&t.sub===sb.id){t.sub=null;ch=true}});if(ch)await savePhoto(p)}it.subs=it.subs.filter(s=>s.id!==sb.id);await saveItem(it);if(S.subId===sb.id)S.subId=null;S.hideSubs.delete(sb.id);recount();render();if(it.subs.length)subsManageSheet(it)});
    el.querySelector('[data-done]').onclick=()=>{closeSheet();render()};
  },{foot:'<button class="btn pri" data-done style="height:48px">Done</button>'});
}
/* ---------- photo picker sheet ---------- */
function photoPickerSheet(title,candidates,onDone,opts={}){
  const sel=new Set();const cap=600;let fType=null,noSub=false;const it=opts.item;
  const types=quickCats().flatMap(c=>sortedItems(c)).map(q=>({q,n:candidates.reduce((n,p)=>n+(p.tags.some(t=>t.item===q.id)?1:0),0)})).filter(x=>x.n);
  const noSubN=it?candidates.reduce((n,p)=>n+(p.tags.some(t=>t.item===it.id&&!t.sub)?1:0),0):0;
  const filtered=()=>{let l=candidates;if(fType)l=l.filter(p=>p.tags.some(t=>t.item===fType));if(noSub&&it)l=l.filter(p=>p.tags.some(t=>t.item===it.id&&!t.sub));return l};
  const chips=()=>`<div class="chips" style="padding-bottom:8px"><button class="pill ${!fType?'on':''}" data-ft="">All · ${candidates.length}</button>${types.map(({q,n})=>`<button class="pill ${fType===q.id?'on':''}" data-ft="${q.id}">${esc(q.name)} · ${n}</button>`).join('')}${it&&it.subs.length?`<button class="pill ${noSub?'acc':''}" data-nosub>No ${esc(singular(catById(it.cat).subLabel.toLowerCase()))} yet · ${noSubN}</button>`:''}</div>`;
  const grid=()=>{const list=filtered().slice(0,cap);return `${filtered().length>cap?`<div class="note" style="padding-top:0">Showing the newest ${cap} of ${filtered().length}.</div>`:''}<div class="grid3" id="pp">${list.map(p=>`<button class="tile ${sel.has(p.id)?'sel':''}" data-pp="${p.id}"><div class="img"><img alt="" data-p="${p.id}" data-k="t">${p.kind==='video'?`<span class="badge">▶ ${fmtDur(p.dur)}</span>`:p.kind==='gif'?'<span class="badge">GIF</span>':''}<div class="chk">${sel.has(p.id)?I.check:''}</div></div></button>`).join('')||'<div class="empty" style="grid-column:1/-1">No photos match.</div>'}</div>`};
  sheet(title,grid(),el=>{
    const btn=el.querySelector('[data-done]');const upd=()=>{btn.textContent=`Add ${sel.size}`;btn.disabled=!sel.size};
    const bindGrid=()=>{el.querySelectorAll('[data-pp]').forEach(b=>b.onclick=()=>{const id=b.dataset.pp;sel.has(id)?sel.delete(id):sel.add(id);b.classList.toggle('sel',sel.has(id));b.querySelector('.chk').innerHTML=sel.has(id)?I.check:'';upd()});hydrate(el)};
    const repaint=()=>{el.querySelector('.b').innerHTML=grid();el.querySelector('.sh').innerHTML=chips();bindChips();bindGrid()};
    const bindChips=()=>{el.querySelectorAll('[data-ft]').forEach(b=>b.onclick=()=>{fType=b.dataset.ft||null;repaint()});const ns=el.querySelector('[data-nosub]');if(ns)ns.onclick=()=>{noSub=!noSub;repaint()}};
    el.querySelector('[data-all]').onclick=()=>{const list=filtered().slice(0,cap);const all=list.every(p=>sel.has(p.id));list.forEach(p=>all?sel.delete(p.id):sel.add(p.id));el.querySelectorAll('[data-pp]').forEach(b=>{const on=sel.has(b.dataset.pp);b.classList.toggle('sel',on);b.querySelector('.chk').innerHTML=on?I.check:''});upd()};
    btn.onclick=()=>{closeSheet();onDone([...sel])};
    bindChips();bindGrid();upd();
  },{sub:chips(),foot:'<button class="btn" data-all style="height:48px">Select shown</button><button class="btn pri" data-done style="height:48px" disabled>Add 0</button>'});
}
function outfitPickSheet(it,onPick){
  const cat=catById(it.cat);
  sheet('Add to which '+esc(singular(cat.subLabel.toLowerCase()))+'?',`<div class="list">${it.subs.map(s=>`<button class="li" data-s="${s.id}"><div class="t">${esc(s.name)}</div><div class="s">${subCount(it.id,s.id)}</div></button>`).join('')}<button class="li" data-s="__new"><div class="t" style="color:var(--acc2)">+ New ${esc(singular(cat.subLabel.toLowerCase()))}</div></button></div>`,el=>el.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{closeSheet();if(b.dataset.s==='__new')subForm(it,null,s=>onPick(s));else onPick(subOf(it,b.dataset.s))}));
}
/* ---------- export / import ---------- */
const EXPORT_PART=400;
function dataJSON(part,of,ids){return {version:2,exported:new Date().toISOString(),part,of,cats:S.cats,items:S.items,recent:S.recent,photos:S.photos.map(p=>({...meta(p),file:'photos/'+p.id+extFor(p),thumb:'thumbs/'+p.id+'.jpg',orig:p.hasOrig?'originals/'+p.id+'.jpg':null,inPart:ids?ids.has(p.id):true}))}}
async function buildZip(photos,withData,part,of){
  const z=new JSZip();const ids=new Set(photos.map(p=>p.id));
  if(withData)z.file('data.json',JSON.stringify(dataJSON(part,of,ids)));
  const f=z.folder('photos'),t=z.folder('thumbs'),o=z.folder('originals');let n=0;
  for(const p of photos){const r=await DB.get('blobs',p.id);const th=await DB.get('thumbs',p.id);if(!r)continue;f.file(p.id+extFor(p),r.full);if(withData&&th)t.file(p.id+'.jpg',th.thumb);if(withData&&r.orig&&(r.orig.buf||r.orig.full))o.file(p.id+'.jpg',r.orig.buf||r.orig.full);if(++n%25===0){showProgress(n,photos.length,'Packing');await sleep(0)}}
  const blob=await z.generateAsync({type:'blob',compression:'STORE'});hideProgress();return blob;
}
async function shareOrDownload(blob,name){
  const file=new File([blob],name,{type:'application/zip'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return true}catch(e){if(e.name==='AbortError')return false}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);return true;
}
function exportSheet(){
  const ps=S.photos.slice().sort((a,b)=>a.added-b.added);const of=Math.max(1,Math.ceil(ps.length/EXPORT_PART));const day=new Date().toISOString().slice(0,10);
  sheet('Export backup',`<div class="note" style="padding-top:0;padding-bottom:12px">${ps.length} photos in ${of} part${of===1?'':'s'} of up to ${EXPORT_PART}. Every part carries all tags, so parts can be imported in any order. Export one at a time; each opens the share sheet.</div><div class="list">${Array.from({length:of},(_,i)=>`<button class="li" data-part="${i}"><div><div class="t">Part ${i+1} of ${of}</div><div class="s">${Math.min(EXPORT_PART,ps.length-i*EXPORT_PART)} photos</div></div>${I.chev}</button>`).join('')}</div>`,el=>{
    el.querySelectorAll('[data-part]').forEach(b=>b.onclick=async()=>{const i=+b.dataset.part;closeSheet();showProgress(0,0,'Packing');try{const blob=await buildZip(ps.slice(i*EXPORT_PART,(i+1)*EXPORT_PART),true,i+1,of);await shareOrDownload(blob,`photo-sorter-${day}-part${i+1}of${of}.zip`)}catch(e){hideProgress();toast('Export failed: '+(e.message||e))}});
  });
}
async function importZip(file){
  showProgress(0,0,'Reading zip');
  try{
    const z=await JSZip.loadAsync(file);const dj=z.file('data.json');
    if(!dj){hideProgress();await importImageZip(z);return}
    const d=JSON.parse(await dj.async('string'));let n=0,added=0;
    for(const c of d.cats||[])if(!catById(c.id)){await saveCat(c);S.cats.push(c)}
    for(const i of d.items||[]){if(!itemById(i.id)){await saveItem(i);S.items.push(i)}}
    const list=d.photos.filter(q=>q.inPart!==false);const t=list.length;let quota=false;
    for(const q of list){
      showProgress(++n,t,'Importing');if(photoById(q.id))continue;const zf=z.file(q.file);if(!zf)continue;
      const full=new Blob([await zf.async('arraybuffer')],{type:mimeForExt(q.file)});
      let thumb=null;const tf=q.thumb&&z.file(q.thumb);if(tf)thumb=new Blob([await tf.async('arraybuffer')],{type:'image/jpeg'});
      if(!thumb){if(q.kind==='video')continue;const im=await loadImage(full);thumb=await toBlob(draw(im,320),.8)}
      let orig=null;if(q.orig&&typeof q.orig==='string'){const of=z.file(q.orig);if(of)orig={w:q.w,h:q.h,hash:q.hash,buf:await of.async('arraybuffer')}}
      else if(q.orig&&q.orig.file){const of=z.file(q.orig.file);if(of)orig={w:q.orig.w,h:q.orig.h,hash:q.orig.hash,buf:await of.async('arraybuffer')}}
      const p={...q};delete p.file;delete p.thumb;delete p.orig;delete p.inPart;delete p.full;
      try{await saveImages(p,full,thumb,orig);await savePhoto(p)}catch(e){if(isQuota(e)){quota=true;break}throw e}
      S.photos.push(p);photoMap.set(p.id,p);added++;if(n%3===0)await sleep(0);
    }
    S.photos.sort(byNewest);indexPhotos();recount();hideProgress();
    if(quota)await ask(`Storage is full after ${added} photos. Free space and import this part again — photos already here are skipped.`,{ok:'OK',single:true});else toast(`Imported ${added} photo${added===1?'':'s'}`);render();
  }catch(e){hideProgress();toast('Could not read that file')}
}

<script>
/* ---------- actions ---------- */
const actions={
  add:()=>$('#picker').click(),
  search:()=>{S.history.push({view:S.view,catView:S.catView,itemId:S.itemId,subId:S.subId,typeId:S.typeId});go('search');const q=$('#q');if(q)setTimeout(()=>q.focus(),50)},
  galFilter:b=>{S.galFilter=b.dataset.k;render()},

  galGroup:()=>{S.galGroup=S.galGroup==='day'?'month':'day';render()},
  tile:b=>{if(S.select){const id=b.dataset.id;S.select.has(id)?S.select.delete(id):S.select.add(id);b.classList.toggle('sel',S.select.has(id));const chk=b.querySelector('.chk');if(chk)chk.innerHTML=S.select.has(id)?I.check:'';updateSelBar()}else openViewer(b.dataset.id,visibleIds())},

  selTag:()=>tagSheet(`Tag ${S.select.size} photos`,[],async d=>{const before=[];for(const id of S.select){const p=photoById(id);before.push([p,p.tags.map(t=>({...t}))]);for(const t of d)addTag(p.tags,t.item,t.sub);await savePhoto(p)}recount();S.select=null;render();toast('Tags added',async()=>{for(const [p,tags] of before){p.tags=tags;await DB.put('photos',meta(p))}recount();render()})},S.view==='item'?{catId:itemById(S.itemId).cat,itemId:S.itemId}:null),
  selUntag:async()=>{const it=itemById(S.itemId);if(!it)return;const before=[];for(const id of S.select){const p=photoById(id);before.push([p,p.tags.map(t=>({...t}))]);p.tags=p.tags.filter(t=>t.item!==it.id);await DB.put('photos',meta(p))}recount();S.select=null;render();toast('Removed from '+it.name,async()=>{for(const [p,tags] of before){p.tags=tags;await DB.put('photos',meta(p))}recount();render()})},
  selFav:async()=>{const ps=[...S.select].map(photoById);const all=ps.every(p=>p.fav);for(const p of ps){p.fav=!all;await savePhoto(p)}S.select=null;render();toast(all?'Removed from favorites':'Added to favorites',async()=>{for(const p of ps){p.fav=all;await savePhoto(p)}render()})},
  selExport:async()=>{const ps=[...S.select].map(photoById);showProgress(0,ps.length,'Packing');try{const blob=await buildZip(ps,false);await shareOrDownload(blob,'photos.zip')}catch(e){hideProgress();toast('Export failed')}},
  selDelete:async()=>{const n=S.select.size;if(!await ask(`Delete ${n} photo${n===1?'':'s'} from the app?`,{ok:'Delete',danger:true}))return;const kept=await deletePhotos([...S.select],true);S.select=null;render();toast(`Deleted ${n}`,async()=>{await restorePhotos(kept);render()})},
  catSort:b=>{S.catSort[S.catView]=b.dataset.k;render()},

  reorder:()=>reorderSheet(catById(S.catView)),

  openItem:b=>{S.history.push({view:S.view,catView:S.catView,itemId:S.itemId,subId:S.subId,typeId:S.typeId});go('item',{itemId:b.dataset.id,subId:null,typeId:null,kidId:null,hideTypes:new Set(),hideSubs:new Set(),hideKids:new Set()})},
  back:()=>{const h=S.history.pop();S.dupePairs=null;if(h)go(h.view,{catView:h.catView,itemId:h.itemId,subId:h.subId||null,typeId:h.typeId||null});else go('gallery')},
  editItem:()=>{const it=itemById(S.itemId);itemForm(catById(it.cat),it)},

  addToSub:b=>{const it=itemById(S.itemId);const sb=subOf(it,b.dataset.id);if(!sb)return;const cands=S.photos.filter(p=>p.tags.some(t=>t.item===it.id&&t.sub!==sb.id));photoPickerSheet(`Add to ${esc(sb.name)}`,cands,async ids=>{if(!ids.length)return;for(const id of ids){const p=photoById(id);addTag(p.tags,it.id,sb.id);await savePhoto(p)}recount();render();toast(`Added ${ids.length} to ${sb.name}`)},{item:it})},

/* ---------- share-target inbox ---------- */
async function drainShareInbox(){
  if(!('caches' in window))return;
  try{const c=await caches.open('share-inbox');const keys=await c.keys();if(!keys.length)return;const files=[];for(const k of keys){const r=await c.match(k);const b=await r.blob();files.push(new File([b],k.url.split('/').pop()||'shared.jpg',{type:b.type||'image/jpeg'}));await c.delete(k)}if(files.length)await importFiles(files)}catch(e){}
}

    crop=n;draw2()});
  const end=()=>drag=null;cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  if(pick&&!pick.crop){crop={x:0,y:0,w:1,h:1};applyRatio();crop.x=(1-crop.w)/2;crop.y=(1-crop.h)/2}
  L.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{L.querySelectorAll('[data-r]').forEach(x=>x.classList.remove('on'));b.classList.add('on');ratio=b.dataset.r==='free'?null:+b.dataset.r;applyRatio();draw2()});
  const on=(sel,fn)=>{const el=L.querySelector(sel);if(el)el.onclick=fn};
  on('[data-e="rotl"]',()=>{rot=(rot+270)%360;crop={x:0,y:0,w:1,h:1};layout()});
  on('[data-e="rotr"]',()=>{rot=(rot+90)%360;crop={x:0,y:0,w:1,h:1};layout()});
  on('[data-e="reset"]',()=>{rot=0;ratio=null;crop={x:0,y:0,w:1,h:1};L.querySelectorAll('[data-r]').forEach(x=>x.classList.remove('on'));layout()});
  on('[data-e="cancel"]',()=>{L.innerHTML='';after()});
  async function commit(asCopy){
    const W=Math.round(crop.w*rw()),H=Math.round(crop.h*rh());
    const full=document.createElement('canvas');full.width=rw();full.height=rh();drawImage(full.getContext('2d'),0,0,im.naturalWidth,im.naturalHeight,full.width,full.height);
    const out=document.createElement('canvas');out.width=W;out.height=H;out.getContext('2d').drawImage(full,Math.round(crop.x*rw()),Math.round(crop.y*rh()),W,H,0,0,W,H);
    const blob=await toBlob(out,.9);const im2=await loadImage(blob);
    const fullB=await toBlob(draw(im2,2000),.86),thumbB=await toBlob(draw(im2,320),.8);
    let orig=rec.orig||{buf:await rec.full.arrayBuffer(),w:p.w,h:p.h,hash:p.hash};
    if(orig.full&&!orig.buf){try{orig={buf:await orig.full.arrayBuffer(),w:orig.w,h:orig.h,hash:orig.hash}}catch(e){orig={buf:await rec.full.arrayBuffer(),w:p.w,h:p.h,hash:p.hash}}}
    const target=asCopy?{...meta(p),id:uid(),name:(p.name||'photo').replace(/(\.\w+)?$/,' (edited)$1'),imported:Date.now(),src:null,tags:p.tags.map(t=>({...t}))}:p;
    Object.assign(target,{w:im2.naturalWidth,h:im2.naturalHeight,hash:dhash(im2)});
    try{await saveImages(target,fullB,thumbB,orig);await savePhoto(target)}catch(e){toast(isQuota(e)?'Storage is full':'Could not save');return}
    if(asCopy){S.photos.push(target);photoMap.set(target.id,target);S.photos.sort(byNewest);recount()}
    L.innerHTML='';toast(asCopy?'Saved as copy':'Photo updated');if(asCopy){render();openViewer(target.id)}else after();
  }
  on('[data-e="save"]',()=>{if(pick){L.innerHTML='';pick.onPick({x:crop.x,y:crop.y,w:crop.w,h:crop.h})}else commit(false)});
  on('[data-e="copy"]',()=>commit(true));
  requestAnimationFrame(layout);
}

/* ---------- boot ---------- */
$('#picker').onchange=e=>{importFiles(e.target.files);e.target.value=''};
$('#zipPicker').onchange=e=>{if(e.target.files[0])importZip(e.target.files[0]);e.target.value=''};
function showUpdateBanner(){if($('#upd'))return;const b=document.createElement('div');b.id='upd';b.className='banner';b.innerHTML='<span>A new version is ready.</span><button>Reload</button>';b.querySelector('button').onclick=()=>location.reload();document.body.appendChild(b)}
(async()=>{
  try{await load()}catch(e){document.body.innerHTML=`<div class="empty" style="padding-top:120px">Could not open the photo library.<br>${esc(e.message||e)}<br><br>If another tab of this app is open, close it and reload.</div>`;return}
  render();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').then(reg=>{reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)showUpdateBanner()})})}).catch(()=>{})}
  drainShareInbox();
  if(location.search.includes('shared'))history.replaceState(null,'',location.pathname);
})();
</script>
